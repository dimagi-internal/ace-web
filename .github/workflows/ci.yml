name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only run the most recent push per branch — cancel stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone ACE plugin
        # apps/opps/skills.py and apps/system/reader.py load skill + phase
        # metadata from agent frontmatter + lib/artifact-manifest.ts in the
        # ACE plugin repo. Tests exercising the Workbench need this on disk
        # so the dynamic skill registry is populated. Matches the
        # Dockerfile's ``git clone --depth 1 ace.git /app/vendor/ace``.
        # The resulting ../ace path is what config/settings/base.py's
        # default ACE_PLUGIN_PATH resolves to.
        run: git clone --depth 1 https://github.com/dimagi-internal/ace.git ../ace

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        # Pinned to exact tag — astral-sh/setup-uv stopped publishing
        # floating major version aliases starting in v8 (see "Immutable
        # releases and secure tags" in the v8.0.0 release notes).
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Verify uv.lock is in sync with pyproject
        # The committed uv.lock drives the Docker image build (the Dockerfile
        # installs deps via `uv export --frozen` from the lock), while the venv
        # below installs from pyproject. So a dependency added to pyproject
        # without re-locking passes every local + CI test yet is ABSENT from
        # the deployed image — exactly what happened when psycopg[pool] was
        # added but not locked (failed deploy + long CloudWatch root-cause
        # hunt). `uv lock --check` fails the build until `uv lock` is re-run.
        run: uv lock --check

      - name: Create venv and install deps
        run: |
          uv venv --python=3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Pytest
        run: .venv/bin/pytest -v
