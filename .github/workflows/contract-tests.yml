name: Contract tests

# Property-based API contract tests using Schemathesis.
# Runs in-process against the WSGI app (no live server, no Postgres) via
# ``schemathesis.openapi.from_wsgi``.  Uses SQLite in-memory DB (same as
# the unit-test job) to keep it fast and infra-free.
#
# Scope: 36 operations covering auth / workspaces / sessions / tokens.
# External-dep tags (opps/mobile/system/ingest) are excluded — they
# require Drive SA key / EC2 / ACE plugin which aren't available here.
#
# Run locally:
#   uv run pytest tests/contract/ -v -m contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: schemathesis contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clone ACE plugin
        # ACE plugin must be present on disk so that apps/opps/skills.py and
        # apps/system/reader.py can bootstrap the dynamic skill registry at
        # import time (even though system/opps tags are excluded from the
        # contract test run).  Matches the clone in ci.yml.
        run: git clone --depth 1 https://github.com/dimagi-internal/ace.git ../ace

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create venv and install deps
        run: |
          uv venv --python=3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run schemathesis contract tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: .venv/bin/pytest tests/contract/ -v -m contract
