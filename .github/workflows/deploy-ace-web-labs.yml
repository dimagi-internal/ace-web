name: Deploy to Labs (AWS)

# Build images inline and deploy. Any branch works — no dependency on the
# auto-build workflows. Docker registry caching makes code-only rebuilds
# fast (~1-2 min). Hard cutover for speed (~10s downtime, fine for labs).

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations before deployment'
        type: boolean
        required: true
        default: false

# Deploys are serialized (one at a time, never cancelled mid-flight). That makes a
# hung job everyone's problem: it holds this lock and every later deploy queues
# behind it, so the per-job timeout-minutes below are what keep the queue live —
# GitHub's default is 6 HOURS. Seen in canopy-web: configure-aws-credentials
# wedged for ~55min and blocked the queue until it was cancelled by hand.
concurrency:
  group: deploy-labs-ace-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: labs-jj-cluster
  CFN_STACK: ace-web
  ECS_SERVICE: labs-jj-ace-web
  ECR_REPO_BACKEND: labs-jj-ace-web
  ECR_REPO_FRONTEND: labs-jj-ace-web-frontend
  TASK_FAMILY: labs-jj-ace-web

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Enforce main-only deploys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ref is refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploys must run from main. Got ref=${{ github.ref }}. Merge to main first, then re-run this workflow with branch=main."
            exit 1
          fi

      # workflow_dispatch pins github.sha to main's tip AT DISPATCH TIME, and the
      # image is tagged with it — so "merge a PR and kick a deploy" in one breath
      # can build the PRE-merge commit, deploy green, and ship code that isn't
      # there. (Seen in canopy-web: a management command missing from a
      # successful deploy.) It is also how a queued deploy rolls prod BACKWARDS
      # past anything merged while it waited.
      - name: Refuse to deploy a stale commit
        run: |
          TIP=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::error::Stale deploy: this run builds ${{ github.sha }} but main is now $TIP."
            echo "::error::Re-dispatch the deploy so it picks up main's current tip."
            exit 1
          fi
          echo "Deploying main tip $TIP."

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Resolve ACE plugin HEAD SHA
        id: ace-ref
        run: |
          SHA=$(git ls-remote https://github.com/dimagi-internal/ace.git main | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          build-args: |
            ACE_REF=${{ steps.ace-ref.outputs.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:buildcache,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guard
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: false
          build-args: |
            VITE_BASE_PATH=/ace/
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:buildcache,mode=max

  deploy:
    name: Deploy to Fargate
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register migration task definition (image swap only)
        id: register-task
        run: |
          # A THROWAWAY task def used ONLY to run migrations. The real one is
          # registered by CloudFormation in the deploy step below, which owns it.
          #
          # It exists because CFN's Service references its TaskDefinition, so a
          # stack update rolls both atomically — leaving no seam to migrate in.
          # This gives us one: new code against the current schema, before any
          # traffic moves.
          #
          # Built from the LIVE task def rather than deploy/aws/task-definition.json:
          # CloudFormation is now the source of truth for the real definition, and
          # reading live avoids that file drifting into a second, competing one.
          aws ecs describe-task-definition --task-definition "${{ env.ECS_SERVICE }}" \
            --query 'taskDefinition' --output json > /tmp/live.json

          jq --arg backend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ github.sha }}" \
             --arg frontend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}" \
             'del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy) |
              (.containerDefinitions[] | select(.name=="api") | .image) = $backend |
              (.containerDefinitions[] | select(.name=="web") | .image) = $frontend' \
             /tmp/live.json > /tmp/task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "task-def-arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::Migration task def: $NEW_TASK_DEF_ARN"

      - name: Run database migrations
        if: ${{ inputs.run_migrations == true }}
        run: |
          TASK_DEF_ARN="${{ steps.register-task.outputs.task-def-arn }}"

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.LABS_SUBNET }}],securityGroups=[${{ secrets.LABS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Migrations completed successfully"
          else
            STOPPED_REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "::error::Migrations failed (exit=$EXIT_CODE). Stopped reason: $STOPPED_REASON"
            exit 1
          fi

      - name: Deploy (CloudFormation owns the task definition + service)
        run: |
          # CloudFormation registers the real task definition and rolls the
          # service. It is the ONLY writer of both, so the stack cannot drift
          # from what is running.
          #
          # This also PINS the images to the commit SHA. The previous flow
          # registered `:latest`, so the task definition never recorded what was
          # actually deployed and a task restart could silently pull different
          # code. Both tags are already pushed by the build jobs.
          #
          # No more hard cutover: the service now has a deployment circuit
          # breaker, and CFN performs a normal rolling replace, so the ~10s
          # deliberate downtime is no longer the price of a fast deploy.
          aws cloudformation deploy \
            --stack-name "${{ env.CFN_STACK }}" \
            --template-file deploy/aws/ace-web.cfn.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides ImageTag="${{ github.sha }}"
          echo "Rollout complete — new tasks running and healthy."

      - name: Auto-resume runs killed by this deploy (self-heal)
        # The hard cutover above drains the tasks driving live ACE opp runs,
        # leaving their assistant turns stuck mid-stream. Now that the new
        # tasks are healthy, POST to the live service to relaunch every
        # interrupted run from run_state.yaml (detected via the stale
        # driver_heartbeat beacon). Must hit the LIVE service over HTTP, not a
        # one-off ECS task: the resume spawns a detached `drive_turn` child of
        # the serving container, which a run-task container would kill on exit.
        #
        # Guarded so a deploy never fails on this: if the PAT/URL aren't
        # configured yet it logs a warning and moves on. To arm it, set:
        #   secret ACE_WEB_DEPLOY_PAT  — a PAT (mint via /ace:ace-web-pat-mint)
        #                                whose owner is a member of the target
        #                                workspace
        #   var    ACE_WEB_RESUME_URL  — full URL of the bulk endpoint, e.g.
        #     https://<host>/ace/api/w/<workspace-slug>/sessions/resume-interrupted
        env:
          DEPLOY_PAT: ${{ secrets.ACE_WEB_DEPLOY_PAT }}
          RESUME_URL: ${{ vars.ACE_WEB_RESUME_URL }}
        run: |
          if [ -z "$DEPLOY_PAT" ] || [ -z "$RESUME_URL" ]; then
            echo "::warning::ACE_WEB_DEPLOY_PAT secret / ACE_WEB_RESUME_URL var not set — skipping auto-resume. Runs interrupted by this deploy must be resumed manually (POST .../sessions/resume-interrupted)."
            exit 0
          fi
          echo "Resuming interrupted ACE opp runs via $RESUME_URL ..."
          HTTP=$(curl -sS -o /tmp/resume.json -w '%{http_code}' \
            -X POST "$RESUME_URL" \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            -H "Content-Type: application/json" \
            --max-time 60 || echo "000")
          echo "Response (HTTP $HTTP):"; cat /tmp/resume.json 2>/dev/null || true; echo
          if [ "$HTTP" = "200" ]; then
            echo "Auto-resume OK."
          else
            echo "::warning::Auto-resume returned HTTP $HTTP (deploy still succeeded — new code is live). Check service logs / resume manually."
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${{ github.ref_name }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task definition | \`${{ steps.register-task.outputs.task-def-arn }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations run   | \`${{ inputs.run_migrations }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service          | \`${{ env.ECS_SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
