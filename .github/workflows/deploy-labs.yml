name: Deploy to Labs (AWS)

# Manual deployment workflow. Assumes the backend and frontend images
# are already built and pushed to ECR by the auto-triggered
# build-backend.yml / build-frontend.yml workflows. This workflow just
# waits for any in-progress builds, runs migrations if requested,
# registers a new task definition revision from the committed
# deploy/aws/task-definition.json patched with the current git SHA,
# and updates the ECS service.
#
# If a build is still running when this is triggered, it waits.
# If no build has ever run, it can still deploy — the images in ECR may
# be stale (built from an earlier commit), but the deploy itself succeeds.

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations before deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-labs-ace-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: labs-jj-cluster
  ECS_SERVICE: labs-jj-ace-web
  ECR_REPO_BACKEND: labs-jj-ace-web
  ECR_REPO_FRONTEND: labs-jj-ace-web-frontend
  TASK_FAMILY: labs-jj-ace-web

permissions:
  id-token: write
  contents: read
  actions: read  # needed so `gh run list/watch` can see build workflows

jobs:
  deploy:
    name: Deploy to Fargate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main-only deploys
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploys must run from main. Got ref=${{ github.ref }}. Merge to main first, then re-run this workflow with branch=main."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for in-progress image builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Wait for any currently-running or queued build workflows to finish
          # before deploying. This prevents deploying a stale :latest tag while
          # the next one is still in flight.
          for WF in "Build Backend Image" "Build Frontend Image"; do
            RUNNING=$(gh run list \
              --workflow="$WF" \
              --status=in_progress \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$RUNNING" ]; then
              echo "$WF in progress (run $RUNNING), waiting..."
              gh run watch "$RUNNING" --exit-status
            fi
            QUEUED=$(gh run list \
              --workflow="$WF" \
              --status=queued \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$QUEUED" ]; then
              echo "$WF queued (run $QUEUED), waiting..."
              gh run watch "$QUEUED" --exit-status
            fi
          done

      - name: Verify both :latest image tags exist in ECR
        run: |
          for REPO in "${{ env.ECR_REPO_BACKEND }}" "${{ env.ECR_REPO_FRONTEND }}"; do
            EXISTS=$(aws ecr list-images \
              --repository-name "$REPO" \
              --query "imageIds[?imageTag=='latest'].imageTag" \
              --output text 2>&1) || true
            if [ -z "$EXISTS" ] || [ "$EXISTS" = "None" ]; then
              echo "::error::$REPO has no :latest tag. Trigger Build Backend/Frontend Image workflow manually first."
              exit 1
            fi
            echo "✓ $REPO:latest found"
          done

      - name: Register new task definition revision
        id: register-task
        run: |
          # Patch the committed task-definition.json with :latest image URIs.
          # Using :latest (not :sha) because the build workflows push :latest
          # on every change — deploy just points the task def at whatever
          # :latest currently is.
          jq --arg backend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest" \
             --arg frontend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest" \
             '(.containerDefinitions[] | select(.name=="api") | .image) = $backend |
              (.containerDefinitions[] | select(.name=="web") | .image) = $frontend' \
             deploy/aws/task-definition.json > /tmp/task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-def-arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::Registered task definition: $NEW_TASK_DEF_ARN"

      - name: Run database migrations
        if: ${{ inputs.run_migrations == true }}
        run: |
          TASK_DEF_ARN="${{ steps.register-task.outputs.task-def-arn }}"

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.LABS_SUBNET }}],securityGroups=[${{ secrets.LABS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Migrations completed successfully"
          else
            STOPPED_REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "::error::Migrations failed (exit=$EXIT_CODE). Stopped reason: $STOPPED_REASON"
            exit 1
          fi

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.task-def-arn }} \
            --output text > /dev/null

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task definition | \`${{ steps.register-task.outputs.task-def-arn }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations run   | \`${{ inputs.run_migrations }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service          | \`${{ env.ECS_SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
