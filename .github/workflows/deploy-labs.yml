name: Deploy to Labs (AWS)

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy (auto detects changes from last deploy)'
        type: choice
        options:
          - auto
          - all
          - frontend-only
          - backend-only
        default: auto
      run_migrations:
        description: 'Run database migrations before deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-labs-ace-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: labs-jj-cluster
  ECS_SERVICE: labs-jj-ace-web
  ECR_REPO_BACKEND: labs-jj-ace-web
  ECR_REPO_FRONTEND: labs-jj-ace-web-frontend
  TASK_FAMILY: labs-jj-ace-web
  VITE_BASE_PATH: /ace/

permissions:
  id-token: write
  contents: read

jobs:
  # ── Detect what changed since the last deploy ──
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        if: inputs.deploy_target == 'auto'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine changed components
        id: changes
        run: |
          TARGET="${{ inputs.deploy_target }}"

          if [ "$TARGET" = "all" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy target: all (forced)"
            exit 0
          fi

          if [ "$TARGET" = "frontend-only" ]; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy target: frontend-only (forced)"
            exit 0
          fi

          if [ "$TARGET" = "backend-only" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy target: backend-only (forced)"
            exit 0
          fi

          # Auto-detect: get last deployed SHA from ECR backend image tag
          LAST_SHA=$(aws ecr describe-images \
            --repository-name "${{ env.ECR_REPO_BACKEND }}" \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags' \
            --output json 2>/dev/null \
            | jq -r '.[] | select(. != "latest")' 2>/dev/null || echo "")

          if [ -z "$LAST_SHA" ] || ! git cat-file -e "$LAST_SHA" 2>/dev/null; then
            echo "::warning::Could not find last deployed SHA, deploying all"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Comparing $LAST_SHA..HEAD"
          CHANGED=$(git diff --name-only "$LAST_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Categorize changes
          BACKEND=false
          FRONTEND=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              frontend/*) FRONTEND=true ;;
              Dockerfile.frontend) FRONTEND=true ;;
              Dockerfile) BACKEND=true ;;
              *) BACKEND=true ;;
            esac
          done <<< "$CHANGED"

          # If migrations requested, backend must be built
          if [ "${{ inputs.run_migrations }}" = "true" ]; then
            BACKEND=true
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "::notice::Auto-detected — backend=$BACKEND frontend=$FRONTEND"

  # ── Build backend image (parallel) ──
  build-backend:
    name: Build backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Build frontend image (parallel) ──
  build-frontend:
    name: Build frontend
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Run migrations in a one-off Fargate task ──
  migrate:
    name: Run migrations
    needs: build-backend
    if: inputs.run_migrations == true
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run migrations as one-off FARGATE task
        run: |
          TASK_DEF_ARN=$(aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_FAMILY }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.LABS_SUBNET }}],securityGroups=[${{ secrets.LABS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" == "0" ]; then
            echo "Migrations completed successfully"
          else
            echo "Migrations failed with exit code: $EXIT_CODE"
            exit 1
          fi

  # ── Deploy: register new task def revision then update service ──
  deploy:
    name: Deploy service
    needs: [build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition revision
        id: register-task
        run: |
          # Patch the committed task-definition.json with the new image SHA tags.
          jq --arg backend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ github.sha }}" \
             --arg frontend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}" \
             '(.containerDefinitions[] | select(.name=="api") | .image) = $backend |
              (.containerDefinitions[] | select(.name=="web") | .image) = $frontend' \
             deploy/aws/task-definition.json > /tmp/task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-def-arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::Registered task definition: $NEW_TASK_DEF_ARN"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.task-def-arn }} \
            --output text

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend   | ${{ needs.build-backend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend  | ${{ needs.build-frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations| ${{ inputs.run_migrations }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task def  | ${{ steps.register-task.outputs.task-def-arn }} |" >> "$GITHUB_STEP_SUMMARY"
