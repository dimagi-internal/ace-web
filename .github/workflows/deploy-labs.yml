name: Deploy to Labs (AWS)

# Build images inline and deploy. Any branch works — no dependency on the
# auto-build workflows. Docker registry caching makes code-only rebuilds
# fast (~1-2 min). Hard cutover for speed (~10s downtime, fine for labs).

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations before deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: deploy-labs-ace-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: labs-jj-cluster
  ECS_SERVICE: labs-jj-ace-web
  ECR_REPO_BACKEND: labs-jj-ace-web
  ECR_REPO_FRONTEND: labs-jj-ace-web-frontend
  TASK_FAMILY: labs-jj-ace-web

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Enforce main-only deploys
    runs-on: ubuntu-latest
    steps:
      - name: Check ref is refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploys must run from main. Got ref=${{ github.ref }}. Merge to main first, then re-run this workflow with branch=main."
            exit 1
          fi

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Resolve ACE plugin HEAD SHA
        id: ace-ref
        run: |
          SHA=$(git ls-remote https://github.com/jjackson/ace.git main | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          build-args: |
            ACE_REF=${{ steps.ace-ref.outputs.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:buildcache,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          provenance: false
          build-args: |
            VITE_BASE_PATH=/ace/
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:buildcache,mode=max

  deploy:
    name: Deploy to Fargate
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition revision
        id: register-task
        run: |
          jq --arg backend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_BACKEND }}:latest" \
             --arg frontend "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest" \
             '(.containerDefinitions[] | select(.name=="api") | .image) = $backend |
              (.containerDefinitions[] | select(.name=="web") | .image) = $frontend' \
             deploy/aws/task-definition.json > /tmp/task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-def-arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::Registered task definition: $NEW_TASK_DEF_ARN"

      - name: Run database migrations
        if: ${{ inputs.run_migrations == true }}
        run: |
          TASK_DEF_ARN="${{ steps.register-task.outputs.task-def-arn }}"

          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.LABS_SUBNET }}],securityGroups=[${{ secrets.LABS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' \
            --output text)

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Migrations completed successfully"
          else
            STOPPED_REASON=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' \
              --output text)
            echo "::error::Migrations failed (exit=$EXIT_CODE). Stopped reason: $STOPPED_REASON"
            exit 1
          fi

      - name: Shorten ALB target-group deregistration delay
        run: |
          # Default 300s deregistration drain is the long pole in rolling
          # cutover. Reduce to 30s — labs has no long-poll requests beyond
          # SSE/WebSocket, which the app already handles via reconnect.
          # Idempotent: re-running the same attribute is a no-op.
          # Requires elasticloadbalancing:ModifyTargetGroupAttributes on
          # the github-actions-labs-deploy role (added 2026-04-18).
          TG_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text)
          if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
            aws elbv2 modify-target-group-attributes \
              --target-group-arn "$TG_ARN" \
              --attributes Key=deregistration_delay.timeout_seconds,Value=30 \
              --output text > /dev/null
            echo "deregistration_delay set to 30s on $TG_ARN"
          fi

      - name: Deploy (hard cutover)
        run: |
          # Stop existing tasks for instant cutover (~10s downtime).
          # Acceptable for internal tool; avoids 2-3 min rolling-update wait.
          echo "Stopping old tasks..."
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --query 'taskArns[]' \
            --output text 2>/dev/null) || true
          if [ -n "$TASK_ARNS" ] && [ "$TASK_ARNS" != "None" ]; then
            for TASK in $TASK_ARNS; do
              aws ecs stop-task --cluster ${{ env.ECS_CLUSTER }} --task "$TASK" --output text > /dev/null 2>&1 || true
            done
          fi

          echo "Forcing new deployment..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.task-def-arn }} \
            --force-new-deployment \
            --output text > /dev/null

          echo "Waiting for rollout to complete (so 'deploy done' actually means serving new code)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "Rollout complete — new tasks running and healthy."

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | \`${{ github.ref_name }}\` @ \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task definition | \`${{ steps.register-task.outputs.task-def-arn }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migrations run   | \`${{ inputs.run_migrations }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service          | \`${{ env.ECS_SERVICE }}\` |" >> "$GITHUB_STEP_SUMMARY"
