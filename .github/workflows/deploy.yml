name: Deploy to Cloud Run

# Manual only — per team policy, deploys are not triggered by merges to main.
# Run this workflow from the Actions tab (Run workflow) to deploy the current
# ref of this branch to the ace-web Cloud Run service in the connect-labs
# GCP project.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to push to production.'
        required: true
        default: ""

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: connect-labs
  GCP_PROJECT_NUMBER: "502453377792"
  GCP_REGION: us-central1
  ARTIFACT_REPO: ace-web
  IMAGE_NAME: app
  CLOUD_RUN_SERVICE: ace-web
  CLOUD_RUN_HOST: ace-web-hhhi4yut3q-uc.a.run.app
  CLOUD_SQL_INSTANCE: ace-web-db
  WIF_PROVIDER: projects/502453377792/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: ace-web-deployer@connect-labs.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write  # required for Workload Identity Federation

jobs:
  deploy:
    name: Build image and deploy revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Guard — confirm input
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "::error::You must type 'deploy' in the confirm input to run this workflow."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Compute image tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          TAG="${{ github.run_number }}-${SHA_SHORT}"
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:${TAG}"
          LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.latest }}
          cache-to: type=inline

      - name: Deploy new revision to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --platform=managed \
            --add-cloudsql-instances="${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars=DJANGO_SETTINGS_MODULE=config.settings.production \
            --set-env-vars=DJANGO_ALLOWED_HOSTS=${{ env.CLOUD_RUN_HOST }} \
            --set-env-vars=CLOUD_SQL_CONNECTION_NAME=${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.CLOUD_SQL_INSTANCE }} \
            --set-env-vars=ACE_IAP_REQUIRED=True \
            --set-secrets=DJANGO_SECRET_KEY=ace-web-django-secret:latest \
            --set-secrets=DATABASE_URL=ace-web-database-url:latest \
            --min-instances=1 \
            --max-instances=1 \
            --memory=1Gi \
            --cpu=1 \
            --no-allow-unauthenticated

      - name: Summarize deploy
        run: |
          URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.url)')
          REV=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} --region=${{ env.GCP_REGION }} --format='value(status.latestReadyRevisionName)')
          {
            echo "## Deploy summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Service | \`${{ env.CLOUD_RUN_SERVICE }}\` |"
            echo "| Region | \`${{ env.GCP_REGION }}\` |"
            echo "| Image | \`${{ steps.tag.outputs.image }}\` |"
            echo "| Ready revision | \`${REV}\` |"
            echo "| URL | ${URL} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
