name: Regenerate OpenAPI types

# Frontend types (frontend/src/api/generated.ts) are generated from the backend's
# OpenAPI schema. This job VERIFIES they are up to date on any PR that touches the
# API surface — it regenerates and fails if the committed file is stale. It does
# NOT commit for you.
#
# Why verify instead of auto-commit (it used to auto-commit, and that broke twice
# on 2026-07-26):
#
#   1. It checked out `github.event.pull_request.head.ref` — the BRANCH NAME —
#      because pushing a commit back needs a writable branch ref. When a PR
#      auto-merges, the branch is deleted immediately (delete_branch_on_merge is
#      on), and this job's checkout then fails fetching a ref that no longer
#      exists. PRs #691 and #692 both showed a red `regen` for exactly that
#      reason, with nothing wrong with the types at all. A default checkout
#      resolves the PR's merge SHA and does not care whether the branch survives.
#
#   2. A bot commit pushed with the default GITHUB_TOKEN cannot trigger required
#      CI checks (GitHub's workflow-loop guard), so the auto-commit left the PR
#      head with no status checks and blocked the merge — the same failure
#      canopy-web hit and documented before switching this job to verify.
#
# Fix a real failure locally and commit the result.

on:
  pull_request:
    paths:
      - "apps/**/api.py"
      - "apps/**/schemas.py"
      - "apps/api/**"

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: oven-sh/setup-bun@v2
      - name: Set up Python
        run: uv python install 3.11
      - name: Install backend deps
        run: uv sync --extra dev
      - name: Boot Django for schema dump
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.test uv run python -c "
          import django, json
          django.setup()
          from apps.api.api import api
          with open('frontend/openapi.json', 'w') as f:
            json.dump(api.get_openapi_schema(), f, indent=2)
          "
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Regenerate types
        run: cd frontend && bunx openapi-typescript openapi.json --output src/api/generated.ts --immutable
      - name: Fail if types are stale
        run: |
          if ! git diff --quiet frontend/src/api/generated.ts; then
            echo "::error::frontend/src/api/generated.ts is out of date with the OpenAPI schema."
            echo "You changed an API schema/route but didn't regenerate the frontend types."
            echo "Fix it locally and commit the result:"
            echo "    cd frontend && bunx openapi-typescript openapi.json --output src/api/generated.ts --immutable"
            echo "--- diff ---"
            git --no-pager diff frontend/src/api/generated.ts
            exit 1
          fi
          echo "frontend/src/api/generated.ts is up to date."
