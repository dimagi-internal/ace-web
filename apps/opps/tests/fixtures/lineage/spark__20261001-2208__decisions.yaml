- id: sol-devices-and-system-of-record-2208
  phase: 8-solicitation-management
  skill: solicitation-create
  question: Does the listing ask about CBF smartphones/connectivity or whether CBFs file the record instead
    of or in addition to Spark's form, and how is the rate framed?
  ai-default: Not asked; rate all-in with CBF vs organisation split
  options:
  - Not asked; rate all-in with CBF vs organisation split
  - 'Ask PDD §12 #1 and #5; devices costed separately'
  - Ask about devices; devices costed separately
  reasoning: 'Standing operator directives: devices, data and system of record are ASSUMED, never asked
    (2026-09-26), and the rate is ALL-IN with an explicit worker vs commodity split and no separately-funded
    line (2026-09-08, ace#2265). The PDD §12 / work order §2 device go/no-go and separately-costed device
    plan, and the instead-of/in-addition-to filing ask, are therefore omitted from the listing. Indicative
    all-in band shown as MWK 8,000-13,000 (CBF 5,000-10,000 + organisation 3,000, both PROPOSED). Work
    order §2/§6.1 text should be reconciled at contract execution.'
  source: PDD §10, §10.1, §12; work order §2, §6.1; solicitation-create design principles
  supersedes: solicitation-all-in-rate-and-devices
  status: overridden
  value_set_by: external
  evidence_basis: conflicting
  conflict_signals:
  - 'PDD §12 asks #1 and #5 and work order §2: confirm smartphones/connectivity or cost devices separately;
    ask whether CBFs file instead of or in addition to Spark''s form'
  - Operator directives 2026-09-26 (devices/system of record assumed, never asked) and 2026-09-08 (all-in
    rate, no separately-funded line)
  plain: The call asks each applicant how many facilitators already have a working phone and mobile data,
    and to price a separate plan for the rest; the per-meeting rate covers the work itself.
  override: Ask about devices; devices costed separately
  override_reasoning: 'Operator decision 2026-10-04 (Jonathan Jackson): we want to understand what each
    applicant will do about devices. The listing now asks how many CBFs already have a working smartphone
    and mobile data and, for the rest, a costed device plan stated separately from the per-meeting rate;
    Dimagi agrees that cost at contract execution. This overrides the 2026-09-26 ''devices assumed, never
    asked'' directive for this pilot only, because the PDD''s own evidence (Spark''s tablet-and-file-share
    programme) argues against assuming smartphones. The work order §2/§6.1 follows. Whether CBFs file
    instead of or in addition to Spark''s form is still not asked.'
  plain_value: Ask about phones and data; price devices separately
