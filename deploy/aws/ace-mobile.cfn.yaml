# PHASE 1 — this template describes resources that already exist, provisioned
# by infra/mobile/*.tf with no remote backend and no state file anywhere (the
# config was orphaned from the AWS resources it described). A later task
# adopts them via `create-change-set --change-set-type IMPORT`, which only
# succeeds if the template agrees with reality — so nothing below is
# aspirational. Every property was read off infra/mobile/*.tf or measured
# directly against the live resources on 2026-09-09. Change things AFTER the
# import lands, one ordinary stack update at a time.
#
# One instance, one bucket, one alarm, one role. No SSH key, no ALB, no
# inbound security-group rule — access to the running instance is
# exclusively through SSM Session Manager.
#
# DELIBERATELY NOT IN THIS STACK: `ace-mobile-task-addon-<env>`, the
# customer-managed IAM policy Terraform output for the operator to attach by
# hand to ace-web's own ECS task role (owned by deploy/aws/ace-web.cfn.yaml, a
# different stack — importing it here would mean two stacks fighting over one
# role). See infra/mobile/iam.tf's own comment on why that attachment stays
# manual.
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The ACE mobile emulator runner on the connect-labs platform (EC2 instance +
  launch template, egress-only security group, IAM instance role, S3
  artifacts bucket, CloudWatch idle-stop alarm) — replacing infra/mobile/*.tf,
  which never had a backend or state file. PHASE 1: describes what already
  exists so a later task can import it; see the comments above this block.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      The AMI baked by infra/mobile-ami/ (Packer). Must live in the stack's
      region. Default is the AMI the live instance is currently running.
    Default: ami-057bc47bcbe68e69e
  InstanceType:
    Type: String
    Description: >
      Default m8i.xlarge is the smallest m8i that exposes nested virt for
      KVM (`kvm-ok` must succeed during the AMI bake). If KVM ever fails,
      fallbacks in cost order are c8i.xlarge (also nested-virt) or
      m7i.metal-24xl (bare metal, significantly more expensive).
    Default: m8i.xlarge
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC that owns SubnetId below. Not a measured fact carried over from
      Terraform (infra/mobile/main.tf resolved it dynamically from the
      account's default VPC via a data source) — supply the parent VPC of
      SubnetId at deploy time.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Subnet for the emulator instance. Must have outbound 443 egress to
      reach SSM and S3. Default is the subnet the live instance runs in.
    Default: subnet-0d744956f8178d950
  EnvSuffix:
    Type: String
    Description: >
      Suffix appended to global resource names so dev/staging/prod can
      co-exist in the same account (S3 bucket name, IAM resource names,
      security group / launch template names).
    Default: labs
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: must be lowercase letters, digits, or hyphens.

Resources:
  # No ingress rules. Period. Access is via SSM Session Manager.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ace-mobile-emulator-${EnvSuffix}"
      GroupDescription: "Egress-only SG for the ACE mobile emulator. SSM only - no inbound."
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: "Outbound HTTPS for SSM, S3, package mirrors."
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: "Outbound HTTPS for SSM, S3, package mirrors (IPv6)."
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"
        - Description: "Outbound DNS (UDP) for in-VM lookups."
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: owner
          Value: ace-web-mobile-poc
        - Key: auto-stop
          Value: "true"
        - Key: managed-by
          Value: terraform
        - Key: env
          Value: !Ref EnvSuffix
        - Key: Name
          Value: !Sub "ace-mobile-emulator-${EnvSuffix}"

  # 1. mobile-instance-role: attached to the EC2 instance itself. Lets the
  #    SSM agent register with AWS Systems Manager and lets the in-VM
  #    `aws s3 cp` upload artifacts to the artifacts bucket, and read the
  #    test-user secret for cold-boot registration recipes.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ace-mobile-instance-role-${EnvSuffix}"
      Description: "EC2 instance role for the ACE mobile emulator runner."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Inline: PutObject on the artifacts bucket, scoped to its prefix.
        - PolicyName: !Sub "ace-mobile-instance-s3-${EnvSuffix}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactsPutObject
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: ArtifactsListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactsBucket.Arn
        # Read test-user creds for the cold-boot registration recipes. Scoped
        # to the specific secret so the instance can't read others.
        - PolicyName: !Sub "ace-mobile-instance-secrets-${EnvSuffix}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadTestUserCreds
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ace-mobile-test-user-creds-*"
      Tags:
        - Key: owner
          Value: ace-web-mobile-poc
        - Key: auto-stop
          Value: "true"
        - Key: managed-by
          Value: terraform
        - Key: env
          Value: !Ref EnvSuffix

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "ace-mobile-instance-profile-${EnvSuffix}"
      Roles:
        - !Ref InstanceRole
    # AWS::IAM::InstanceProfile has no Tags property in CloudFormation, so
    # the `tags = local.common_tags` Terraform set on this resource has no
    # home here. See task-1-report.md.

  # EC2 launch template + lone instance for the mobile emulator runner.
  #
  # Why a launch template AND a standalone instance? The launch template
  # captures the canonical block-device + IMDS + tag config so future
  # scale-up to a small fleet is a one-line change. For the POC we
  # instantiate exactly one Instance from it.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "ace-mobile-emulator-${EnvSuffix}"
      VersionDescription: "Mobile emulator runner - KVM-on-EC2, SSM-only access."
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: owner
              Value: ace-web-mobile-poc
            - Key: auto-stop
              Value: "true"
            - Key: managed-by
              Value: terraform
            - Key: env
              Value: !Ref EnvSuffix
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !GetAtt SecurityGroup.GroupId
        InstanceInitiatedShutdownBehavior: stop
        BlockDeviceMappings:
          - DeviceName: /dev/sda1 # root volume on Ubuntu HVM AMIs
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required # IMDSv2 only
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: owner
                Value: ace-web-mobile-poc
              - Key: auto-stop
                Value: "true"
              - Key: managed-by
                Value: terraform
              - Key: env
                Value: !Ref EnvSuffix
              - Key: Name
                Value: ace-mobile-emulator
          - ResourceType: volume
            Tags:
              - Key: owner
                Value: ace-web-mobile-poc
              - Key: auto-stop
                Value: "true"
              - Key: managed-by
                Value: terraform
              - Key: env
                Value: !Ref EnvSuffix
              - Key: Name
                Value: ace-mobile-emulator-root
    # Nested virt is required for the Android emulator's KVM path on
    # virtualized m8i/c8i/r8i (Feb 2026 AWS feature, default-off). Terraform
    # set it via a post-create `aws ec2 modify-instance-cpu-options` CLI call
    # against the stopped instance (its provider didn't expose
    # cpu_options.nested_virtualization yet); CloudFormation has no
    # declarative property for it either and no local-exec equivalent, so it
    # isn't represented here. It's already set on the live instance — see
    # task-1-report.md.

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: "$Latest"
      SubnetId: !Ref SubnetId
      Tags:
        - Key: owner
          Value: ace-web-mobile-poc
        - Key: auto-stop
          Value: "true"
        - Key: managed-by
          Value: terraform
        - Key: env
          Value: !Ref EnvSuffix
        - Key: Name
          Value: ace-mobile-emulator
    # Terraform stops this instance once at create-time (a null_resource
    # local-exec `aws ec2 stop-instances` + wait, idempotent on reapply) so
    # the POC's one idle instance doesn't burn ~$0.16/hour doing nothing;
    # ace-web boots it on demand via /api/mobile/ensure-running. CFN has no
    # provisioner equivalent — the live instance is already stopped (see the
    # measured state), but a future replacement created through this stack
    # would come up running and need a manual stop. Terraform's
    # `lifecycle.ignore_changes = [ami, user_data]` (don't fight ace-web /
    # the CloudWatch alarm's start-stop activity, and don't replace the
    # instance on every AMI bump) likewise has no direct CFN property;
    # pointing at LaunchTemplate Version "$Latest" gets the closest
    # equivalent — a template edit doesn't itself touch this resource's
    # properties, so it won't force a replacement.

  # Artifacts bucket: Maestro screenshots, JUnit XML, recipe stdout/stderr.
  # DeletionPolicy/UpdateReplacePolicy Retain because it holds captured test
  # artifacts and losing it is the one unrecoverable outcome here — even
  # though the lifecycle rule below hard-deletes objects after 7 days
  # (POC scale; nothing in the bucket is meant to be durable), the BUCKET
  # itself must survive a stack delete or replace.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ace-mobile-artifacts-${EnvSuffix}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning is left unset (never enabled) rather than declared
      # "Disabled": the S3 API only knows Enabled/Suspended once versioning
      # has ever been turned on, so the equivalent of Terraform's explicit
      # `status = "Disabled"` is omitting VersioningConfiguration entirely.
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-7-days
            Status: Enabled
            Prefix: ""
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: owner
          Value: ace-web-mobile-poc
        - Key: auto-stop
          Value: "true"
        - Key: managed-by
          Value: terraform
        - Key: env
          Value: !Ref EnvSuffix
        - Key: Name
          Value: !Sub "ace-mobile-artifacts-${EnvSuffix}"

  # Layer-3 backstop. If the in-VM idle watchdog (`ace-idle-shutdown.timer`,
  # 5-minute window) fails to fire — kernel panic, watchdog disabled, etc —
  # this alarm stops the instance after 5 consecutive 1-minute periods of
  # CPUUtilization < 5% (Maximum statistic, so a single spike resets the
  # window).
  #
  # Tightened from 30 min → 5 min on 2026-05-09 per operator request: the
  # safety-net should be aggressive so a bug in layers 1/2 can't quietly
  # leak hours of EC2 charges. A live recipe run keeps CPU well above 5%
  # (emulator + Maestro), so a 5-min idle window during an active run is
  # only possible if something has already gone wrong.
  #
  # The alarm action `arn:aws:automate:<region>:ec2:stop` is the AWS-builtin
  # auto-stop action — no Lambda or SNS in the loop.
  IdleStopAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ace-mobile-emulator-idle-stop-${EnvSuffix}"
      AlarmDescription: "Stop the ACE mobile emulator after 5 min of <5% CPU."
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 5
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      AlarmActions:
        - !Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:stop"
      Tags:
        - Key: owner
          Value: ace-web-mobile-poc
        - Key: auto-stop
          Value: "true"
        - Key: managed-by
          Value: terraform
        - Key: env
          Value: !Ref EnvSuffix

Outputs:
  InstanceId:
    Description: "Plug into ace-web's ACE_MOBILE_INSTANCE_ID env var."
    Value: !Ref Instance
  SecurityGroupId:
    Description: "Egress-only SG attached to the emulator instance."
    Value: !GetAtt SecurityGroup.GroupId
  ArtifactsBucketName:
    Description: "Plug into ace-web's ACE_MOBILE_S3_BUCKET env var."
    Value: !Ref ArtifactsBucket
  ArtifactsBucketArn:
    Description: "ARN of the artifacts bucket."
    Value: !GetAtt ArtifactsBucket.Arn
  InstanceRoleArn:
    Description: "ARN of the EC2 instance role."
    Value: !GetAtt InstanceRole.Arn
