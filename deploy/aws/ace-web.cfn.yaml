AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ace-web on the connect-labs platform (labs.connect.dimagi.com/ace). PHASE 1 —
  IMPORT ONLY: adopts resources that already exist, created by
  deploy/aws/one-time-setup.sh before there was any IaC.

# WHY EVERY VALUE HERE IS TRANSCRIBED, NOT CHOSEN
# ------------------------------------------------
# These resources ALREADY EXIST. They come into the stack via
# `create-change-set --change-set-type IMPORT`, which adopts them without
# recreating anything — but ONLY if the template agrees with reality. A mismatch
# either fails the import or, worse, makes CloudFormation decide a resource needs
# REPLACING: replacing the ECS service means downtime, replacing the target group
# leaves the listener rule dangling. So nothing below is aspirational. Every
# property was read off the live resource on 2026-07-26. Change things AFTER the
# import lands, one ordinary stack update at a time.
#
# DELIBERATELY NOT IMPORTED IN THIS PHASE
#   * TaskDefinition — immutable revisions; CFN creates a fresh one in phase 2
#     rather than adopting revision 456.
#   * The 13 secrets and 2 ECR repos — stable, and importing them adds 15
#     resources' worth of exact-match risk for no deploy benefit. Referenced by
#     ARN instead; importable later if wanted.
#
# ace-web is a TWO-container task (api on :8000, nginx/web on :3000 — the one the
# load balancer targets), unlike canopy-web's single-container monolith.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-024df4c7bcc30cb01
  HttpsListenerArn:
    Type: String
    Default: arn:aws:elasticloadbalancing:us-east-1:858923557655:listener/app/labs-jj-alb/ffecbe258260c7ee/95873265402e7831
  ClusterName:
    Type: String
    Default: labs-jj-cluster
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::858923557655:role/labs-jj-ecs-task-execution-role
  TaskRoleArn:
    Type: String
    Default: arn:aws:iam::858923557655:role/labs-jj-ecs-task-role
  # The one input a deploy changes. Both container images are tagged with the
  # same commit SHA, so one parameter drives the whole release.
  ImageTag:
    Type: String
    Default: latest

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ecs/labs-jj-ace-web
      # 30 days, like canopy-web and umami (only connect-labs' web/worker keep
      # 731, for its HIPAA audit trail). Unset meant "never expire": ACE run
      # content in exception text (PDD text, OCS transcripts, Connect/HQ
      # responses) was kept forever. Changing this calls logs:PutRetentionPolicy,
      # which the CI deploy role (github-actions-ace-web-deploy) does not hold —
      # an admin applies a change to it (docs/deploy.md).
      RetentionInDays: 30

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: labs-jj-ace-web-tg
      VpcId: !Ref VpcId
      # Port 3000 = the nginx/web container, NOT the api container. The ALB talks
      # to nginx, which proxies to the api on 8000 inside the task.
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /ace/api/health
      HealthCheckPort: traffic-port
      # 5s/4s, as canopy-web (its deploy/aws/canopy-web.cfn.yaml, 2026-09-08). At
      # 30s x 2 checks a healthy new task waited up to a minute to be admitted
      # before the old one could start draining. /api/health is a DB + redis
      # ping that a task that is up answers at once. Unhealthy stays 3 checks.
      #
      # The deploy role can apply this: it holds ModifyTargetGroup on this TG,
      # and canopy-web's role (same shape) changed its health check through the
      # pipeline on 2026-10-06. DescribeTargetGroupAttributes is denied to both
      # (it takes no resource-level ARN) and CloudFormation tolerates that.
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 4
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      # Declared here so CloudFormation is the ONLY writer. The deploy workflow
      # used to re-assert these on every run — self-healing, but a second writer,
      # which is exactly the pattern this migration removed everywhere else.
      TargetGroupAttributes:
        # Default 300s drain is the long pole in a rolling cutover. Labs has no
        # long-poll requests beyond SSE/WebSocket, which the app handles by
        # reconnecting — and a draining task is about to be stopped anyway, so
        # its WebSockets reconnect either way; waiting longer only delays the
        # deploy. 5s (canopy-web's value) lets in-flight HTTP requests land.
        - Key: deregistration_delay.timeout_seconds
          Value: "5"
        # LOAD-BEARING, not a preference: pins each browser to one ECS task via
        # the AWSALB cookie so a Session's long-lived `claude` subprocess pool is
        # reused across turns. Without it a 2-task service re-rolls task affinity
        # on every WebSocket (~50% reuse).
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "3600"

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      # 20 — canopy sits at 29/30, umami at 40. Priorities are unique per
      # listener, so this value is load-bearing, not cosmetic.
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values: ["/ace/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Our OAuth discovery documents live at the HOST ROOT, not under /ace: RFC 8414
  # §3.1 and RFC 9728 §3.1 insert the well-known segment between host and path,
  # so issuer https://labs.connect.dimagi.com/ace is described at
  # /.well-known/oauth-authorization-server/ace, and the MCP resource
  # …/ace/api/mcp/ at /.well-known/oauth-protected-resource/ace/api/mcp/. canopy
  # finds our token endpoint there when it redeems a host grant; without this
  # rule the listener's default sent them to connect-labs, which 404s, and every
  # grant was refused (2026-09-28). Exact segments, not `ace*`, so a future
  # /ace-something app is never swallowed. canopy is at 28, this at 19.
  #
  # APPLIED WITH ADMIN CREDENTIALS, not by the pipeline: per-app deploy roles
  # deliberately cannot write listener rules (canopy-web deploy/aws/deploy_roles.py)
  # — a role that could add one could route another app's paths to itself. An
  # unchanged rule costs the pipeline nothing, so only a CHANGE here needs an admin
  # `aws cloudformation deploy`.
  WellKnownListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: 19
      Conditions:
        - Field: path-pattern
          Values:
            - "/.well-known/oauth-authorization-server/ace"
            - "/.well-known/oauth-authorization-server/ace/*"
            - "/.well-known/oauth-protected-resource/ace"
            - "/.well-known/oauth-protected-resource/ace/*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    # Every deploy registers a new revision and replaces this resource. Without
    # Retain, CloudFormation then tries to DELETE the old revision, but the deploy
    # role (github-actions-ace-web-deploy) has no ecs:DeregisterTaskDefinition, so
    # the delete fails, CloudFormation retries it twice three minutes apart, and
    # gives up: ~6 of every deploy's ~11 CloudFormation minutes went to a cleanup
    # that never happened (stack events, 2026-10-13: Service UPDATE_COMPLETE
    # ~4.5 min in, then three DELETE_FAILEDs, then stack UPDATE_COMPLETE "could
    # not be deleted"). Retain says what was already true — old revisions stay —
    # and skips the wait. Same fix as canopy-web #1030/#1076.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: labs-jj-ace-web
      Cpu: "1024"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: api
          # The ONLY thing a deploy changes. Everything else is declarative.
          Image: !Sub "858923557655.dkr.ecr.us-east-1.amazonaws.com/labs-jj-ace-web:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          # The `web` container starts only once this reports HEALTHY, and the
          # first probe runs one Interval after start — so at 30s every rollout
          # waited ~30s for a probe even when the api was already up. 5s probes
          # admit it as soon as it answers. Retries 6 keeps the old tolerance
          # for a transient DB/redis blip at roughly the same order (30s of
          # consecutive failures before ECS replaces the task, was 90s).
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
            Interval: 5
            Timeout: 4
            Retries: 6
            StartPeriod: 30
          Environment:
            - Name: ACE_ALLOWED_EMAIL_DOMAINS
              Value: "dimagi.com,dimagi-ai.com,dimagi-associate.com"
            - Name: ACE_WEB_BASE_URL
              Value: "https://labs.connect.dimagi.com/ace"
            # The 1Password vault ACE's .env.tpl reads (`op://${AGENT_VAULT}/…`
            # since ace@7e683db6). canopy-web records it as ACE's op_vault; the
            # entrypoint's `op inject` fails without it (#917). It must match
            # what OP_SERVICE_ACCOUNT_TOKEN can see.
            - Name: AGENT_VAULT
              Value: "Agent-Ace"
            - Name: AWS_REGION
              Value: "us-east-1"
            # Outbound email (invite links) through SES's API as the task role.
            # labs-jj-ecs-task-role already holds ses:SendEmail on the
            # labs.connect.dimagi.com identity + labs-jj-email configuration set
            # (connect-labs infra/labs-email.yml, policy labs-ses-send), so the
            # sender MUST be on that domain. Bounces/complaints go to the
            # labs-jj-email-events SNS topic via the configuration set.
            - Name: ACE_EMAIL_ENABLED
              Value: "true"
            - Name: ACE_SES_CONFIGURATION_SET
              Value: "labs-jj-email"
            - Name: DEFAULT_FROM_EMAIL
              Value: "ACE <noreply@labs.connect.dimagi.com>"
            - Name: CANOPY_AGENT_SLUG
              Value: "ace"
            - Name: CANOPY_APP_NAME
              Value: "ace-web"
            - Name: CANOPY_BASE_URL
              Value: "https://canopy.dimagi.com"
            # The canopy host grant (apps/canopy/grant.py): lets canopy's agent
            # call our MCP AS the visitor, read-only, on registered pages. OFF
            # while unset. Turning it on also needs the ALB to route
            # /.well-known/oauth-*/ace* here and canopy's `ace-web` site row to
            # name our issuer + MCP resource (both done 2026-09-27).
            - Name: CANOPY_CLIENT_ID
              Value: "https://canopy.dimagi.com/oauth/client.json"
            # canopy's live probe (apps/canopy/probe.py): canopy fetches a real
            # ID-JAG for the dedicated probe principal from
            # /ace/api/canopy/oauth/probe and makes one MCP read with it, every
            # 30 min. Non-secret. 404 until migration ace_workspaces.0010 has
            # created the principal (deploy with run_migrations: true).
            - Name: CANOPY_PROBE_ENABLED
              Value: "true"
            # The browser calls canopy at its own address. It was the same-origin
            # path /canopy while canopy lived on this host; canopy.dimagi.com
            # answers ace-web's origin with CORS (no cookies — the Bearer token
            # this page minted is all a call carries), because ace-web is a
            # connected site whose origin is labs.connect.dimagi.com.
            - Name: CANOPY_PUBLIC_BASE_URL
              Value: "https://canopy.dimagi.com"
            # Programmatic runs enqueue a session-targeted canopy Turn instead of
            # spawning `claude -p` in this container. Safe as of 2026-07-28: a
            # session-capable cloud runner exists and carries the full ACE
            # toolchain (canopy-web #499/#503/#504, ace #1005). The ace_web
            # source rule is non-strict, so a dead cloud runner degrades to the
            # laptop rather than wedging the queue.
            - Name: CANOPY_RUN_EXECUTION
              Value: "true"
            - Name: CANOPY_WORKSPACE
              Value: "connect"
            - Name: CONNECT_PRODUCTION_URL
              Value: "https://connect.dimagi.com"
            - Name: CSRF_TRUSTED_ORIGINS
              Value: "https://labs.connect.dimagi.com"
            - Name: DJANGO_ALLOWED_HOSTS
              Value: "labs.connect.dimagi.com,localhost"
            - Name: DJANGO_DEBUG
              Value: "False"
            - Name: DJANGO_SETTINGS_MODULE
              Value: "config.settings.connectlabs"
            - Name: FORCE_SCRIPT_NAME
              Value: "/ace"
            - Name: SECURE_SSL_REDIRECT
              Value: "False"
          Secrets:
            - Name: ACE_DRIVE_SA_KEY_JSON
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-drive-sa-key-json-lIHSY8"
            - Name: ACE_FIELD_ENCRYPTION_KEY
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:ace-web/field-encryption-key-D40eTj"
            - Name: ANTHROPIC_API_KEY
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-anthropic-api-key-x6p0ij"
            # ace-web's Ed25519 private key. It signs a 60-second assertion
            # naming the person whose command we are carrying out; canopy holds
            # only the public half, on its `ace-web` Connected site. Replaced
            # CANOPY_APP_CREDENTIAL, a shared secret that let ace-web mint a
            # token for anyone in its allowed domains — and created the canopy
            # user as a side effect.
            - Name: CANOPY_SIGNING_KEY
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:ace-web/canopy-signing-key-46JCHb"
            - Name: CONNECT_OAUTH_CLIENT_ID
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-connect-oauth-client-id-jzsNCM"
            - Name: CONNECT_OAUTH_CLIENT_SECRET
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-connect-oauth-client-secret-kXQI9s"
            - Name: DATABASE_URL
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-database-url-5KLKYs"
            - Name: DJANGO_SECRET_KEY
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-django-secret-key-2XSt10"
            - Name: OP_SERVICE_ACCOUNT_TOKEN
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-op-service-account-token-aW4N8Y"
            - Name: REDIS_URL
              ValueFrom: "arn:aws:secretsmanager:us-east-1:858923557655:secret:labs-jj-ace-web-redis-url-H4HN9I"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: "true"
              awslogs-group: "/ecs/labs-jj-ace-web"
              awslogs-region: "us-east-1"
              awslogs-stream-prefix: "api"
        - Name: web
          # The ONLY thing a deploy changes. Everything else is declarative.
          Image: !Sub "858923557655.dkr.ecr.us-east-1.amazonaws.com/labs-jj-ace-web-frontend:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          # nginx must not accept traffic before the api is healthy.
          DependsOn:
            - ContainerName: api
              Condition: HEALTHY
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: "true"
              awslogs-group: "/ecs/labs-jj-ace-web"
              awslogs-region: "us-east-1"
              awslogs-stream-prefix: "web"

  Service:
    Type: AWS::ECS::Service
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ServiceName: labs-jj-ace-web
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      DesiredCount: 2
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - subnet-06646effb09be2f42
            - subnet-08a18eb47b48aff54
          SecurityGroups: [sg-0666a5ed512c97d9d]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: web
          ContainerPort: 3000
      # Deliberately NOT cut to canopy-web's 60. The grace period only tells ECS
      # to ignore failing ALB checks on a young task; it never delays admitting
      # a healthy one, so it costs a deploy nothing. And ace-web starts slower
      # than canopy-web: the image pull alone was ~80s on 2026-10-13, then the
      # entrypoint refreshes the ACE plugin and runs `op inject` before the api
      # boots. A shorter grace buys no speed and risks killing a slow start.
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # Matches what the deploy workflow now asserts on every cutover
        # (dimagi-internal/ace-web#689) so the two cannot disagree.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

Outputs:
  ServiceName:
    Value: !Ref Service
  TargetGroupArn:
    Value: !Ref TargetGroup
  Url:
    Value: https://labs.connect.dimagi.com/ace/
