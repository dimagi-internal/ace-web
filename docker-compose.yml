services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
      POSTGRES_DB: ace_web
    ports:
      - "5434:5432"
    volumes:
      - ace-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    # Override the Dockerfile's prod CMD with uvicorn --reload so backend
    # source edits picked up via the bind mounts below trigger an
    # automatic reload — no `docker compose restart app` needed.
    # `--reload-dir` is scoped to the mounted code directories so we
    # don't watch site-packages / vendored plugins (large, noisy).
    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/apps --reload-dir /app/config
    # Run migrations separately: docker compose exec app python manage.py migrate
    #
    # docker-compose automatically loads .env from the repo root for variable
    # substitution. Create a .env file (see .env.example) with the CONNECT_OAUTH_*
    # credentials if you want to exercise the OAuth login flow locally.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure
      DATABASE_URL: postgres://ace:ace@db:5432/ace_web
      REDIS_URL: redis://redis:6379/0
      CONNECT_PRODUCTION_URL: ${CONNECT_PRODUCTION_URL:-https://connect.dimagi.com}
      CONNECT_OAUTH_CLIENT_ID: ${CONNECT_OAUTH_CLIENT_ID:-}
      CONNECT_OAUTH_CLIENT_SECRET: ${CONNECT_OAUTH_CLIENT_SECRET:-}
      # /ace/ path prefix for URL-path parity with production. Override to
      # empty in .env if you prefer to run at the bare root locally.
      FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME-/ace}
      # Drive root folder ID. Default = the shared Dimagi Team folder
      # used in production (read-only via the SA), so a fresh local DB
      # comes up with the same opps when ACE_DRIVE_SA_KEY_JSON is set.
      # The folder ID is a Drive URL fragment, not a secret. Override
      # if you want to point local dev at a different Drive folder.
      ACE_DRIVE_ROOT_FOLDER_ID: ${ACE_DRIVE_ROOT_FOLDER_ID:-1HThsA_0Lr5p1OdI5r-aQ446HlNBaySLz}
      # Service-account key JSON for Drive reads. Drop into .env to make
      # the Workbench actually fetch opp data; without it the workspace
      # exists but Drive lists 401. See README "Mirroring prod Drive".
      ACE_DRIVE_SA_KEY_JSON: ${ACE_DRIVE_SA_KEY_JSON:-}
      # Dev-only test-login endpoint (POST /auth/test-login/) for scripted
      # smoke tests + Playwright. Requires DEBUG=True (already set above).
      ACE_ALLOW_TEST_LOGIN: ${ACE_ALLOW_TEST_LOGIN:-false}
    # Host port 8001 so ace-web can run alongside other Django dev servers
    # (CommCare HQ, connect-labs, etc.) that conventionally bind 8000.
    # Override with `ACE_WEB_HOST_PORT` in .env if 8001 is also in use.
    ports:
      - "${ACE_WEB_HOST_PORT:-8001}:8000"
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - app
    profiles: ["prod-parity"]

volumes:
  ace-pg-data:
