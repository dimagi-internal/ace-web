services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
      POSTGRES_DB: ace_web
    ports:
      - "5434:5432"
    volumes:
      - ace-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # CMD from Dockerfile runs uvicorn directly on port 8000.
    # Run migrations separately: docker compose exec app python manage.py migrate
    #
    # docker-compose automatically loads .env from the repo root for variable
    # substitution. Create a .env file (see .env.example) with the CONNECT_OAUTH_*
    # credentials if you want to exercise the OAuth login flow locally.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure
      DATABASE_URL: postgres://ace:ace@db:5432/ace_web
      CONNECT_PRODUCTION_URL: ${CONNECT_PRODUCTION_URL:-https://connect.dimagi.com}
      CONNECT_OAUTH_CLIENT_ID: ${CONNECT_OAUTH_CLIENT_ID:-}
      CONNECT_OAUTH_CLIENT_SECRET: ${CONNECT_OAUTH_CLIENT_SECRET:-}
      # /ace/ path prefix for URL-path parity with production. Override to
      # empty in .env if you prefer to run at the bare root locally.
      FORCE_SCRIPT_NAME: ${FORCE_SCRIPT_NAME-/ace}
    ports:
      - "8000:8000"
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - app
    profiles: ["prod-parity"]

volumes:
  ace-pg-data:
