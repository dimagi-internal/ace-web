services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
      POSTGRES_DB: ace_web
    ports:
      - "5434:5432"
    volumes:
      - ace-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # The entrypoint handles migrations + uvicorn start. DJANGO_DEBUG=True
    # makes entrypoint.sh pass --reload to uvicorn for hot-reload on save.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure
      DATABASE_URL: postgres://ace:ace@db:5432/ace_web
    ports:
      - "8000:8080"
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py
    depends_on:
      db:
        condition: service_healthy

volumes:
  ace-pg-data:
