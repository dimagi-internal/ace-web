name: "ACE Web — CRISPR-Connect Lifecycle"
narrative: "Follow a CRISPR-Connect opportunity from IDD through the 19-skill pipeline, inspect results in the workbench, and discuss findings in chat."
base_url: "https://labs.connect.dimagi.com"

auth:
  type: command
  check: "curl -s -o /dev/null -w '%{http_code}' https://labs.connect.dimagi.com/ace/api/health"
  login: "echo 'Auth via e2e-login endpoint'"
  inject_url: "/ace/"

personas:
  jj:
    name: "Jonathan Jackson"
    role: "ACE Lead, Dimagi"
    color: "#2563eb"
    intro: "Jonathan leads the ACE initiative. He uses ace-web to monitor CRISPR-Connect opportunities, review pipeline progress, and discuss findings with the team."

scenes:
  - persona: jj
    title: "Opportunity dashboard"
    show: "The opps list page at /ace/opps showing active CRISPR-Connect opportunities"
    impressive_because: "One-glance view of every opportunity's pipeline status — which phase, which step, running or blocked"

  - persona: jj
    title: "Workbench — pipeline overview"
    show: "Open CRISPR-Test-001 in the workbench: the 19-skill pipeline with status indicators, completed steps highlighted, pending steps greyed"
    impressive_because: "The full 19-skill CRISPR-Connect pipeline rendered as an interactive grid — click any step to see artifacts, judge scores, and gate history"

  - persona: jj
    title: "IDD review"
    show: "The IDD body rendered in the workbench detail pane for the idea-to-pdd step — the intervention design for Community Health Worker Training Pilot"
    impressive_because: "The IDD is the foundation of the entire opportunity — it's rendered inline so you can review it without leaving the workbench"

  - persona: jj
    title: "Step detail — training materials"
    show: "Drill into the training-materials step to see its 4 artifacts, judge score, and preview content"
    impressive_because: "Each step has its own artifact list, judge verdict, and gate history — real observability into what the pipeline produced"

  - persona: jj
    title: "Session library"
    show: "The session library at /ace/library with active conversations"
    impressive_because: "Every conversation is persistent and searchable — filter by status, search by title, archive old sessions"

  - persona: jj
    title: "Chat — discuss findings"
    show: "Open a chat session from the library, showing the sidebar with recent sessions and the send box"
    impressive_because: "Multi-player chat with real-time streaming, draft collaboration, and share links — the team's shared interface to Claude"
