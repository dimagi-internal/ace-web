# nginx config for the ace-web frontend container.
#
# Serves the Vite bundle under /ace/ and reverse-proxies /ace/api/* and
# /ace/auth/* to the backend container (which listens on localhost:8000 in
# the same ECS task).

# Map directive must be at http{} level, outside server{}.
#
# Preserve the ALB's X-Forwarded-Proto if the request came with one
# (real client traffic — ALB sets it to "https" when it terminates TLS).
# Fall back to $scheme (the scheme of the nginx listener, "http") for
# requests that arrive without X-Forwarded-Proto (e.g., local dev curl
# directly against nginx, or ALB health checks).
#
# Without this, nginx would clobber X-Forwarded-Proto to "http" for real
# traffic too, causing Django's request.scheme to return "http" and
# build_absolute_uri() to produce http:// OAuth callback URLs that don't
# match the registered https:// redirect URI.
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000;
    server_name _;

    # Where the React bundle lives.
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API + admin + auth to the Django backend.
    location /ace/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Hard-code the Host header to the public hostname so Django's
        # ALLOWED_HOSTS accepts the request. Without this the ALB health
        # check hits the target with Host: <private-ip> and Django rejects
        # it with 400 DisallowedHost. Real user requests would pass the
        # public host through, but overriding it is harmless because
        # Django's build_absolute_uri() also uses this host — and for
        # real traffic, labs.connect.dimagi.com is always correct.
        proxy_set_header Host labs.connect.dimagi.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the ALB's scheme (https for real traffic) instead of
        # $scheme (http — the internal ALB -> nginx hop).
        proxy_set_header X-Forwarded-Proto $real_scheme;
        # SSE: disable buffering and extend timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /ace/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host labs.connect.dimagi.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /ace/admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host labs.connect.dimagi.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Static files served by Django (admin, DRF browsable API, etc).
    location /ace/static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host labs.connect.dimagi.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_cache_valid 200 1h;
    }

    # React Router catch-all: anything under /ace/ that doesn't match an
    # asset falls through to index.html so React Router can handle it.
    # Uses alias so the /ace/ URL prefix is stripped before looking up files
    # in /usr/share/nginx/html/ — this is how Vite's base:'/ace/' output
    # (which puts assets at /usr/share/nginx/html/assets/) maps correctly to
    # URL paths like /ace/assets/index-XXX.js.
    location /ace/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ace/index.html;
    }

    # Redirect bare / to /ace/ so users don't get confused.
    location = / {
        return 301 /ace/;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
