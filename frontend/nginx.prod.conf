# nginx config for the ace-web frontend container.
#
# Serves the Vite bundle under /ace/ and reverse-proxies /ace/api/* and
# /ace/auth/* to the backend container (which listens on localhost:8000 in
# the same ECS task).

# Map directive must be at http{} level, outside server{}.
#
# $real_scheme — preserve the ALB's X-Forwarded-Proto if set (real client
# traffic arrives with it set to "https"), fall back to the nginx
# listener's scheme ($scheme="http") for direct requests or health checks.
# Without this, nginx would clobber X-Forwarded-Proto to "http" for real
# traffic, causing Django's request.scheme to return "http" and
# build_absolute_uri() to produce http:// OAuth callback URLs that don't
# match the registered https:// redirect URI.
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# $backend_host — the Host header to send to the Django backend.
#
# - Real traffic:     Host=labs.connect.dimagi.com (unchanged)
# - ALB health check: Host=<private-ip>  → rewrite to labs.connect.dimagi.com
#                                           so Django's ALLOWED_HOSTS accepts
# - Local prod-parity: Host=localhost:3000 → pass through so
#                      build_absolute_uri() produces http://localhost:3000/...
#                      matching the locally-registered Connect OAuth redirect URI.
map $http_host $backend_host {
    default                         labs.connect.dimagi.com;
    labs.connect.dimagi.com         labs.connect.dimagi.com;
    ~^localhost(:\d+)?$             $http_host;
    ~^127\.0\.0\.1(:\d+)?$          $http_host;
}

server {
    listen 3000;
    server_name _;

    # Where the React bundle lives.
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API + admin + auth to the Django backend.
    location /ace/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Backend Host header routing (see $backend_host map above):
        # - real traffic (labs.connect.dimagi.com): passes through unchanged
        # - ALB health check (private IPs): rewritten to labs.connect.dimagi.com
        # - local prod-parity (localhost:3000): passes through so OAuth
        #   build_absolute_uri() produces http://localhost:3000/... that
        #   matches the locally-registered Connect OAuth redirect URI
        proxy_set_header Host $backend_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the ALB's scheme (https for real traffic) instead of
        # $scheme (http — the internal ALB -> nginx hop).
        proxy_set_header X-Forwarded-Proto $real_scheme;
        # SSE: disable buffering and extend timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /ace/auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /ace/admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Static files served by Django (admin, DRF browsable API, etc).
    location /ace/static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_cache_valid 200 1h;
    }

    # React Router catch-all: anything under /ace/ that doesn't match an
    # asset falls through to index.html so React Router can handle it.
    # Uses alias so the /ace/ URL prefix is stripped before looking up files
    # in /usr/share/nginx/html/ — this is how Vite's base:'/ace/' output
    # (which puts assets at /usr/share/nginx/html/assets/) maps correctly to
    # URL paths like /ace/assets/index-XXX.js.
    location /ace/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /ace/index.html;
    }

    # Redirect bare / to /ace/ so users don't get confused.
    location = / {
        return 301 /ace/;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
