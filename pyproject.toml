[project]
name = "ace-web"
version = "0.1.0"
description = "Web harness for the ACE initiative"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40,<1.0",
    "boto3>=1.34",
    "channels>=4.1",
    "channels-redis>=4.2",
    "cryptography>=42",
    "django-cryptography-django5>=2.2",
    "django-environ>=0.11",
    "django-ninja>=1.3,<2.0",
    "django>=5.0,<6.0",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "httpx[http2]>=0.27",
    "orjson>=3.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8,<3.0",
    "email-validator>=2.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "uvicorn[standard]>=0.30",
    "whitenoise>=6.7",
    "fastmcp>=0.4",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.20",
    "fakeredis[aiohttp]>=2.23",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "schemathesis>=3.30",
    "ipython",
]
walkthrough = [
    "playwright>=1.40",
]

# setuptools cannot auto-discover the package layout because the repo has
# multiple top-level directories (apps/, config/, frontend/, staticfiles/).
# Explicitly tell it which ones are importable Python packages.
[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["frontend*", "staticfiles*", "tests*", "docs*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = "test_*.py"
asyncio_mode = "auto"
# Default-skip contract tests; the dedicated contract-tests workflow opts in
# via `-m contract`. Local devs can run them explicitly with `-m contract`.
addopts = "-m 'not contract'"
markers = [
    "contract: property-based contract tests (schemathesis, slower)",
]

[project.scripts]
ace-upload = "apps.ingest.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# Django migration files are auto-generated and not worth linting.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.basedpyright]
include = ["apps", "config"]
exclude = ["**/migrations", "**/__pycache__", "**/node_modules", "apps/videos/**"]
pythonVersion = "3.11"
# ── Missing stubs context ────────────────────────────────────────────────────
# Running at "standard" / "basic" without django-stubs, django-environ stubs,
# or redis-asyncio stubs produces ~1000 false-positive errors. We selectively
# suppress the rules that are 100% noise from missing stubs and keep the rules
# that catch real code bugs. Path to tighten: add django-stubs + raise to
# "standard", then re-enable the suppressed rules one by one.
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
# ── Suppressed: Django ORM dynamic attrs ─────────────────────────────────────
# Django generates per-model field accessors at runtime; without django-stubs
# basedpyright cannot see them (626 false-positive errors).
reportAttributeAccessIssue = "none"
# ── Suppressed: django-environ overload gap ──────────────────────────────────
# django-environ's Env.__call__ / .list() overloads aren't typed to accept
# default= args; 149 false-positive reportArgumentType errors.
reportArgumentType = "none"
# ── Suppressed: Django Manager / Q() variadics ───────────────────────────────
# Manager.filter() / .values() / Q() use **kwargs; 117 false-positives.
reportCallIssue = "none"
# ── Suppressed: transaction.atomic() + redis-asyncio context managers ────────
# Django's transaction.atomic() is both a context manager and a decorator;
# without django-stubs basedpyright sees it as a plain function, not a CM.
# redis.asyncio commands return opaque Awaitable types without stubs.
# Both generate reportGeneralTypeIssues false-positives (33 errors).
reportGeneralTypeIssues = "none"
# ── Suppressed: test-client .json() subscript ────────────────────────────────
# Django test client response.json() returns dict but basedpyright sees it
# as None in some call paths without Django stubs (40 false-positives).
reportOptionalSubscript = "none"
# ── Suppressed: channels WebSocket scope TypedDict ───────────────────────────
# channels' _ChannelScope TypedDict marks url_route as NotRequired; our
# consumers always have it, but without channels stubs the access errors.
reportTypedDictNotRequiredAccess = "none"
# ── Suppressed: channels/redis optional member access ────────────────────────
# channels InMemoryChannelLayer.group_send / .receive and redis-asyncio
# commands are not typed; 19 false-positive reportOptionalMemberAccess.
reportOptionalMemberAccess = "none"
# ── Suppressed: complex union return types in Ninja endpoints ─────────────────
# mobile/api_v2.py Ninja router returns complex union types that basedpyright
# can't resolve without fastmcp + django-ninja stubs (13 false-positives).
reportReturnType = "none"
# ── Suppressed: Django AppConfig.default_auto_field assignment ───────────────
# AppConfig.default_auto_field = "django.db.models.BigAutoField" is typed
# as AppConfig.default_auto_field: str | None in Django stubs but
# basedpyright infers a Literal narrowing conflict (10 false-positives).
reportAssignmentType = "none"
# ── Suppressed: optional iterable (redis pipeline / channels) ────────────────
reportOptionalIterable = "none"
# ── Suppressed: abstract class instantiation in tests ────────────────────────
# Tests instantiate Protocol/ABC base classes via mock; fine in test context.
reportAbstractUsage = "none"
# ── Keep active ───────────────────────────────────────────────────────────────
# reportMissingImports = "error"   (set above — catches real import errors)
# reportIndexIssue stays active for genuine subscript issues on known types.

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed wide markdown tables and intervention prose verbatim
# inside triple-quoted Python strings; splitting changes the fixture content
# and breaks the parser assertions the tests are designed to verify.
"apps/opps/tests/test_summary.py" = ["E501"]
# The phase→products contract lives in this file's module docstring as a
# wide markdown table; splitting the columns hurts readability.
"apps/opps/summary.py" = ["E501"]
# Videos app has many CLI-spawning log lines and embedded npm commands
# that don't split cleanly; another agent owns this area.
"apps/videos/*.py" = ["E501", "I001", "B904"]
"apps/videos/tests/*.py" = ["E501", "I001", "B904"]
# Probe scripts have wide URL strings + descriptive log lines.
"scripts/qa/*.py" = ["E501"]
