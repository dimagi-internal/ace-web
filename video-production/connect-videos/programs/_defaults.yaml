# Global template — text shared across every program's video.
# Mirrors the messaging on labs.connect.dimagi.com so every video stays
# in sync with the marketing site. Per-program override is possible but
# unusual; the whole point of these defaults is brand consistency.
# Renamed from `brand:` 2026-05-21 to match the editor UI label
# ("GLOBAL TEMPLATE"). Renderer falls back to legacy `brand:` reads for
# any in-the-wild spec.yaml that hasn't been migrated yet.
global_template:
  # Hero tagline rendered on screen during the opening hook beat.
  tagline: "Pay for verified service delivery, not planned activity."
  # Connect's differentiator one-liner (used in voiceover defaults).
  differentiator: "Verified delivery, one service at a time."
  # Four-step cycle shown during the intro_cycle beat. Same labels as
  # the marketing site.
  cycle_steps: ["Learn", "Deliver", "Verify", "Pay"]
  # CTA copy for the outro_cta beat.
  cta: "Request a demo"

fps: 30
total_seconds: 60
beats:
  - { id: hook,     kind: intro_hook,         seconds: 4 }
  - { id: cycle,    kind: intro_cycle,        seconds: 8 }
  - { id: handoff,  kind: intro_handoff,      seconds: 3 }
  - { id: scene,    kind: body_scene,         seconds: 7 }
  - { id: problem,  kind: body_problem_stat,  seconds: 10 }
  - { id: product,  kind: body_product_beats, seconds: 12 }
  - { id: impact,   kind: body_impact_stats,  seconds: 8 }
  - { id: cta,      kind: outro_cta,          seconds: 8 }
voice:
  provider: elevenlabs
  voice_id: "21m00Tcm4TlvDq8ikWAM"
  model: eleven_turbo_v2

# Music bed mixed under the full 60s.
# Track: "Water — Afro Pop Music" by Kontraa via Pixabay (Pixabay Content
# License: free for commercial use, no attribution required). Vocals-free.
# Per-program override: copy this block into a program YAML to swap.
music_bed:
  asset: assets/shared/connect-music-bed-pixabay.mp3
  start_seconds: 0
  duration_seconds: 60
  volume_db: -28
