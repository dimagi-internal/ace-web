slug: chc
name: Child Health Campaign
country_focus: Kenya
status: Active in 8 countries
tagline: "Door-to-door Vitamin A, deworming, and immunization promotion."
program_url: https://labs.connect.dimagi.com/

# Drive-backed asset manifest. Each entry maps a local alias to a source.
# Aliases are referenced elsewhere in this spec as `@<alias>`.
#
# Format:
#   gdrive:<fileId>.<ext>   -> fetched via ace-gdrive into
#                              ~/.cache/connect-videos/<fileId>.<ext>
#                              and symlinked into public/assets/programs/chc/
#   file:<path>             -> plain local path, no fetch
#   <plain path>            -> same as file:, legacy form
#
# Source folder (Kenya CHC media kit by Psych Media Productions):
#   https://drive.google.com/drive/folders/1AmkxI9Zoi0llDq6KzkVpnZGaCVsr0bKN
manifest:
  # Naming convention:
  #   mobile-* = phone screen recordings of the Connect FLW app
  #   web-*    = web app / Labs dashboard recordings
  #   field-*  = real-world b-roll
  # Product-feature edits (Video Edits folder)
  mobile-learn:          gdrive:1dI_1NwTdMoW49Vk2HdJVbbni0S188H8n.mp4
  mobile-pay:            gdrive:1vyxeW7F_2vFkZukFKrMzY7caxuygDbB5.mp4
  mobile-mapping:        gdrive:1dvb_1TJuEfRgMr2i913h7YRSSNOXTn5f.mp4
  web-superset-graphs:   gdrive:1aOgcC5EQioXMriZ3krVYmDTPuYrA1MT9.mp4
  web-microplan:         gdrive:1UC6QSQB2rMcDYBKcZ3Wmj-cqx7dY6Kno.mp4
  # `visit-stats` (gdrive 1UlrT_…) dropped — `web-superset-graphs` is the
  # canonical stats visualization and reads stronger.
  # Field b-roll (B-ROLLS folder, Kikapu Garden / Nairobi shoot)
  # Aliases describe the dominant action visible in each clip.
  field-walking-towards-house:    gdrive:10ZVEiFx3KQBj7nNP8c9lP5fHM5hWpORf.mp4  # 3s wide village settlement, figure walks toward a house
  field-walking-in-market-flws:   gdrive:1XvEe52tIr8jVjMHc0LJw6QPwO0e4vu4C.mp4  # 6s FLWs walking the street market
  field-group-around-woman:       gdrive:14hGIWbv4GcJ0HAm3ZzWEm1KhLK8AjhPQ.mp4  # 23s FLW group gathered around a woman

scene:
  # Real field b-roll from the Kikapu Garden / Nairobi shoot.
  # Order: group around woman (sets program) -> FLWs walking the
  # market (door-to-door) -> wide village establishing shot.
  clips:
    - "@field-group-around-woman"
    - "@field-walking-in-market-flws"
    - "@field-walking-towards-house"
  lower_third: "Kenya · Child Health Campaign"

problem:
  big: "1M+"
  caption: "verified visits delivered across 8 countries — built to scale further."
  source: "labs.connect.dimagi.com"

product:
  beats:
    - asset: "@mobile-learn"
      caption: "FLW certified through Learn modules"
    - asset: "@web-superset-graphs"
      caption: "Service tracked and verified in real time"
    - asset: "@mobile-pay"
      caption: "Payment lands the moment delivery confirms"

impact:
  - big: "$1.70"
    caption: "average cost per verified visit"
  - big: "22%"
    caption: "cost reduction per visit at scale"

narration:
  generator: manual
  prompt_version: v3
  start_seconds: 0
  # Per-beat caption text. Captions follow beat boundaries exactly — no
  # more "previous beat's narration showing during this beat".
  # Each beat's text is synthesized to its own audio clip and placed at
  # the beat's start time. Word counts are tuned so each clip fits its
  # beat duration at ~150 wpm (with atrim as a safety net).
  by_beat:
    hook:    "Pay for verified service delivery — not effort."
    cycle:   "Frontline Workers learn, deliver, verify — and get paid the moment delivery confirms."
    handoff: "Here's how that works for the Child Health Campaign."
    scene:   "In Kenya, Frontline Workers deliver Vitamin A, deworming, and immunization — door to door."
    problem: "Over one million visits already delivered — every one independently verified with photos and GPS, before payment is approved."
    product: "Local delivery organizations watch every visit on a live dashboard, in real time. Funders fund outcomes — not paperwork, not promises."
    impact:  "A dollar seventy per verified visit. Costs dropping twenty-two percent as the program scales — proven across eight countries."
    cta:     ""
  # ElevenLabs synthesizes from this `script` — keep it semantically
  # close to the by_beat union but with natural sentence rhythm.
  script: |
    Pay for verified service delivery — not promises, not effort.
    Frontline Workers learn, deliver, verify — and get paid the moment delivery confirms.
    Here's how that works in the Child Health Campaign.
    Across eight countries, Frontline Workers go door to door — Vitamin A, deworming, and immunization for children under five.
    A million plus visits already delivered, with verified results at every step.
    Local delivery organizations watch every visit on a live dashboard.
    Funders fund outcomes — not paperwork.
    A dollar seventy per visit.
    Costs dropping twenty-two percent at scale.

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
