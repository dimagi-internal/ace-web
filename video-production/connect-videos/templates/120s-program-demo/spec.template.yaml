# 120-second program demo — spec skeleton.
#
# Author-time docs only — apps/videos/templates.py strips this leading
# comment block before returning skeleton_yaml.
#
# This template follows Matt's MBW Killer Demo outline (2026). The
# core distinction vs the 60s template: this assumes the viewer
# already knows what Connect is. Beats go deeper into the mechanism
# (Learn / Deliver / Pay / Verify subloop / FLW lifecycle / PM
# oversight) and the closing returns to the opening place.
#
# Required {{placeholders}}:
#
#   Identity (operator-known):
#     {{program_slug}} {{workspace_slug}} {{program_name}}
#     {{country_focus}} {{status}} {{program_tagline}} {{program_url}}
#     {{template_id}} {{generated_at}}
#
#   Per-section content (LLM-generated):
#     {{scene_lower_third}}             "<Country> · <Program name>"
#     {{problem_big}}                   headline stakes number
#     {{problem_caption}}               one-line stakes framing
#     {{problem_source}}                attribution
#     {{impact_1_big}} {{impact_1_caption}}
#     {{impact_2_big}} {{impact_2_caption}}
#     {{impact_3_big}} {{impact_3_caption}}     (third impact stat —
#                                                room budget allows it)
#
#   Per-beat narration (each ±2 words from target):
#     {{narration_set_scene}}           ~15w. Drone + village b-roll.
#     {{narration_problem}}             ~22w. EBF/coverage gap stats.
#     {{narration_connect_overview}}    ~20w. 10s recap of Connect mechanism.
#     {{narration_learn}}               ~25w. Animated slide-2 voiceover +
#                                              FLW Learn screen recordings.
#     {{narration_learn_to_deliver}}    ~12w. FLW passes test, eligible.
#     {{narration_deliver}}             ~30w. Animated slide-3 voiceover +
#                                              FLW Delivery screens.
#     {{narration_payment}}             ~15w. Visit approved, payment lands.
#     {{narration_verification_intro}}  ~14w. "But how is service verified?"
#     {{narration_network_manager}}     ~25w. NM platform walkthrough,
#                                              verification-rule example.
#     {{narration_audit_image}}         ~20w. Bulk image audit, ANC cards,
#                                              objective criteria.
#     {{narration_audit_gps}}           ~20w. GPS table, flagged behavior,
#                                              suspicious case detail.
#     {{narration_flw_lifecycle}}       ~25w. Probation, deactivation,
#                                              relearn, performance bar.
#     {{narration_program_manager}}     ~25w. Audit-of-Audits dashboard,
#                                              dropoff rate longitudinal.
#     {{narration_closing}}             ~20w. Drone return, "Connect:
#                                              verify delivery, pay
#                                              results, enable insight."
#     {{narration_cta}}                 empty — outro plays brand card.
#
# Manifest entries: this template REQUIRES program-specific footage.
# Leave the manifest empty and emit a `manifest_todo:` list of needed
# clip aliases so the operator can hand-attach.

provenance:
  generator: video-from-program-page
  template: "{{template_id}}"
  generated_from: "{{program_url}}"
  generated_at: "{{generated_at}}"
  status: "scaffold-only"

slug: "{{program_slug}}"
workspace: "{{workspace_slug}}"
name: "{{program_name}}"
country_focus: "{{country_focus}}"
status: "{{status}}"
tagline: "{{program_tagline}}"
program_url: "{{program_url}}"

# Footage required for a full render. The generator should list every
# alias the spec references; the operator hand-attaches before render.
manifest_todo:
- alias: drone-village-open
  intent: "Opening drone shot — country + village context"
  hint: "{{country_focus}} drone footage; 4-6s usable"
- alias: drone-village-close
  intent: "Closing drone return — mothers, babies, village"
  hint: "{{country_focus}}; 4-6s usable; ideally same village as open"
- alias: scene-context-broll
  intent: "Short clips for the opening scene set"
  hint: "2-3 clips of FLWs or beneficiaries in-place"
- alias: slide-2-animated
  intent: "Animated Learn slide"
  hint: "Pull from the program's slide deck if available"
- alias: slide-3-animated
  intent: "Animated Deliver slide"
- alias: flw-learn-screens
  intent: "FLW Learn module screen recordings (3-4 clips)"
- alias: flw-deliver-screens
  intent: "FLW Delivery form screen recordings (4-6 clips)"
- alias: payment-notification-screen
  intent: "FLW phone showing visit approved + payment amount"
- alias: nm-dashboard-walkthrough
  intent: "Network Manager platform — verification rules + rejected payment example"
- alias: nm-image-audit
  intent: "Bulk image audit screen — ANC cards, side-by-side review"
- alias: nm-gps-review
  intent: "GPS table screen + map drill-down for a flagged case"
- alias: nm-overview-table
  intent: "FLW overview table with probation flags + followup-rate metric"
- alias: pm-audit-of-audits
  intent: "Program Manager Audit-of-Audits dashboard — trends, task metrics"

manifest: {}

scene:
  clips: []
  lower_third: "{{scene_lower_third}}"

problem:
  big: "{{problem_big}}"
  caption: "{{problem_caption}}"
  source: "{{problem_source}}"

product:
  beats: []

impact:
- big: "{{impact_1_big}}"
  caption: "{{impact_1_caption}}"
- big: "{{impact_2_big}}"
  caption: "{{impact_2_caption}}"
- big: "{{impact_3_big}}"
  caption: "{{impact_3_caption}}"

narration:
  generator: manual
  prompt_version: v1-120s
  start_seconds: 0
  by_beat:
    set_scene: "{{narration_set_scene}}"
    problem: "{{narration_problem}}"
    connect_overview: "{{narration_connect_overview}}"
    learn: "{{narration_learn}}"
    learn_to_deliver: "{{narration_learn_to_deliver}}"
    deliver: "{{narration_deliver}}"
    payment: "{{narration_payment}}"
    verification_intro: "{{narration_verification_intro}}"
    network_manager: "{{narration_network_manager}}"
    audit_image: "{{narration_audit_image}}"
    audit_gps: "{{narration_audit_gps}}"
    flw_lifecycle: "{{narration_flw_lifecycle}}"
    program_manager: "{{narration_program_manager}}"
    closing: "{{narration_closing}}"
    cta: ""
  script: ""

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
