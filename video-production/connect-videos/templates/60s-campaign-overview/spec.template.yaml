# 60-second campaign overview — spec skeleton.
#
# Author-time docs only; the template loader (apps/videos/templates.py)
# strips this leading comment block before returning skeleton_yaml so
# placeholder *references* inside doc text don't get substituted into
# the generated spec.
#
# Placeholders the generator must fill:
#
#   Identity (the operator-known facts):
#     {{program_slug}}        slug — lowercase + hyphens (e.g. "kangaroo-care")
#     {{workspace_slug}}      which ace-web workspace owns this program
#     {{program_name}}        display name (e.g. "Kangaroo Care")
#     {{country_focus}}       primary country (e.g. "Uganda")
#     {{status}}              short status line (e.g. "Active in 4 countries")
#     {{program_tagline}}     one-line program-level tagline (NOT Connect's tagline)
#     {{program_url}}         canonical URL for the program page
#     {{template_id}}         echoed back — fill with the template id you fetched
#     {{generated_at}}        ISO-8601 UTC timestamp at fill time
#
#   Per-section content (LLM-generated from the source page):
#     {{scene_lower_third}}   e.g. "Uganda · Kangaroo Care"
#     {{problem_big}}         headline number (e.g. "350K")
#     {{problem_caption}}     one-line problem framing
#     {{problem_source}}      attribution (e.g. "labs.connect.dimagi.com")
#     {{impact_1_big}}        first impact number (e.g. "$1.40")
#     {{impact_1_caption}}    first impact line
#     {{impact_2_big}}        second impact number
#     {{impact_2_caption}}    second impact line
#
#   Per-beat narration (each ±2 words from target — over-budget gets cut mid-word):
#     {{narration_hook}}      ~10 words. Paraphrase Connect's tagline.
#     {{narration_cycle}}     ~20 words. Walk Learn / Deliver / Verify / Pay.
#     {{narration_handoff}}   ~8 words. Hand off to this specific program.
#     {{narration_scene}}     ~20 words. What field footage is showing.
#     {{narration_problem}}   ~25 words. Frame the headline stat in human terms.
#     {{narration_product}}   ~30 words. Walk the app screenshots.
#     {{narration_impact}}    ~20 words. Read out the impact stats.
#     {{narration_cta}}       Leave empty — outro plays under brand CTA card.
#
# Manifest entries are NOT placeholders — the generator discovers Drive media
# separately and either populates manifest:/scene/product or leaves them empty
# for hand-edit.

provenance:
  generator: video-from-program-page
  template: "{{template_id}}"
  generated_from: "{{program_url}}"
  generated_at: "{{generated_at}}"

slug: "{{program_slug}}"
workspace: "{{workspace_slug}}"
name: "{{program_name}}"
country_focus: "{{country_focus}}"
status: "{{status}}"
tagline: "{{program_tagline}}"
program_url: "{{program_url}}"

# Drive-backed asset manifest. The generator either pre-populates this
# from a Drive folder listing or leaves it blank for hand-edit.
manifest: {}

scene:
  clips: []
  lower_third: "{{scene_lower_third}}"

problem:
  big: "{{problem_big}}"
  caption: "{{problem_caption}}"
  source: "{{problem_source}}"

product:
  beats: []

impact:
- big: "{{impact_1_big}}"
  caption: "{{impact_1_caption}}"
- big: "{{impact_2_big}}"
  caption: "{{impact_2_caption}}"

narration:
  generator: manual
  prompt_version: v3
  start_seconds: 0
  by_beat:
    hook: "{{narration_hook}}"
    cycle: "{{narration_cycle}}"
    handoff: "{{narration_handoff}}"
    scene: "{{narration_scene}}"
    problem: "{{narration_problem}}"
    product: "{{narration_product}}"
    impact: "{{narration_impact}}"
    cta: ""
  script: ""

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
