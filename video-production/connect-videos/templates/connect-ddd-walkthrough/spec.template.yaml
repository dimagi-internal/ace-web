# connect-ddd-walkthrough — spec skeleton (semi-gloss walkthrough narration).
#
# Author-time docs only; the template loader (apps/videos/templates.py)
# strips this leading comment block before returning skeleton_yaml so
# placeholder *references* inside doc text don't get substituted into
# the generated spec.
#
# This template narrates an EXISTING product walkthrough recording. It
# does NOT composite marketing beats. The arc is:
#   intro_title  → one title card
#   body_walkthrough × N → each plays a RANGE of ONE master clip
#                          full-bleed with a lower-third + per-beat VO
#   outro_card   → the brand end card
#
# The `beats:` list IS the timeline — supplying it here is what selects
# this arc over the shared programs/global_style.yaml marketing arc.
#
# Placeholders the generator must fill:
#
#   Identity:
#     {{program_slug}}     slug — lowercase + hyphens
#     {{workspace_slug}}   ace-web workspace that owns this video
#     {{program_name}}     title-card headline (e.g. "Verified Monitoring")
#     {{country_focus}}    primary country
#     {{status}}           short status line
#     {{program_tagline}}  one-line subtitle shown under the title card
#     {{program_url}}      canonical URL
#     {{template_id}}      echo "connect-ddd-walkthrough"
#     {{generated_at}}     ISO-8601 UTC timestamp
#
#   Master clip:
#     {{master_asset}}     file:/gdrive:/library: ref for the ONE screen
#                          recording every walkthrough beat slices into.
#
#   Per walkthrough beat (repeat the s1..sN blocks as needed):
#     {{sN_start_seconds}}    in-point into the master clip (seconds)
#     {{sN_seconds}}          on-screen duration of this section (seconds)
#     {{sN_lower_third}}      the section's lower-third label (short)
#     {{narration_sN}}        the per-beat voiceover sentence
#
# Keep `beats[].seconds` == the matching `walkthrough.sN.duration_seconds`
# so the section plays exactly its authored range. The renderer also
# audio-aligns (extends a beat whose VO overruns) at render time.

provenance:
  generator: video-from-walkthrough
  template: "{{template_id}}"
  generated_from: "{{program_url}}"
  generated_at: "{{generated_at}}"

slug: "{{program_slug}}"
workspace: "{{workspace_slug}}"
name: "{{program_name}}"
country_focus: "{{country_focus}}"
status: "{{status}}"
tagline: "{{program_tagline}}"
program_url: "{{program_url}}"

manifest:
  master: "{{master_asset}}"

beats:
  - { id: title, kind: intro_title,      seconds: 4 }
  - { id: s1,    kind: body_walkthrough, seconds: "{{s1_seconds}}" }
  - { id: s2,    kind: body_walkthrough, seconds: "{{s2_seconds}}" }
  - { id: s3,    kind: body_walkthrough, seconds: "{{s3_seconds}}" }
  - { id: outro, kind: outro_card,       seconds: 5 }

walkthrough:
  s1:
    asset: "@master"
    start_seconds: "{{s1_start_seconds}}"
    duration_seconds: "{{s1_seconds}}"
    lower_third: "{{s1_lower_third}}"
  s2:
    asset: "@master"
    start_seconds: "{{s2_start_seconds}}"
    duration_seconds: "{{s2_seconds}}"
    lower_third: "{{s2_lower_third}}"
  s3:
    asset: "@master"
    start_seconds: "{{s3_start_seconds}}"
    duration_seconds: "{{s3_seconds}}"
    lower_third: "{{s3_lower_third}}"

narration:
  generator: manual
  prompt_version: v1
  start_seconds: 0
  by_beat:
    title: "{{narration_title}}"
    s1: "{{narration_s1}}"
    s2: "{{narration_s2}}"
    s3: "{{narration_s3}}"
    outro: ""
  script: ""

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
