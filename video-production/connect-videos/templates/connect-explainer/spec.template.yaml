# connect-explainer — spec skeleton (explainer mode).
#
# Author-time docs only; the template loader (apps/videos/templates.py)
# strips this leading comment block before returning skeleton_yaml so
# placeholder *references* inside doc text don't get substituted into
# the generated spec.
#
# This is the GENERIC "how Connect works" explainer. It carries no
# prospect block and no program-specific identity beyond a generic
# name, and it OMITS the problem + impact stat-card beats entirely
# (explainer mode — see src/lib/spec.ts: problem/impact are optional,
# and Root.tsx::filterDefaultsForSpec drops the matching beats from the
# timeline). The rendered video is ~42s: hook, cycle, handoff, scene,
# product (4 app clips), cta.
#
# Placeholders the generator must fill:
#
#   Identity:
#     {{program_slug}}     slug — lowercase + hyphens (e.g. "connect-explainer")
#     {{workspace_slug}}   which ace-web workspace owns this video
#     {{program_name}}     generic display name (e.g. "CommCare Connect")
#     {{country_focus}}    primary country/region label (e.g. "Global")
#     {{status}}           short status line (e.g. "Live")
#     {{program_tagline}}  one-line tagline
#     {{program_url}}      canonical URL (e.g. https://connect.dimagi.com/)
#     {{template_id}}      echoed back — fill with the template id you fetched
#     {{generated_at}}     ISO-8601 UTC timestamp at fill time
#
#   Per-section content:
#     {{scene_lower_third}}  e.g. "Frontline delivery, end to end"
#
#   Per-beat narration (each ±2 words from target):
#     {{narration_hook}}     ~10 words. Reaching the last mile is the hard part.
#     {{narration_cycle}}    ~16 words. Walk Learn / Deliver / Verify / Pay.
#     {{narration_handoff}}  ~8 words. Hand off to "here's how it works."
#     {{narration_scene}}    ~18 words. What the field footage shows.
#     {{narration_product}}  ~30 words. Walk the 4 app clips incl. AI features.
#     {{narration_cta}}      Leave empty — outro plays under the brand CTA card.
#
# manifest / scene.clips / product.beats reference the standard library
# clips. The generator populates them from the workspace media library
# (library:video/... refs) or leaves the example values below.

provenance:
  generator: connect-explainer
  template: "{{template_id}}"
  generated_from: "{{program_url}}"
  generated_at: "{{generated_at}}"

slug: "{{program_slug}}"
workspace: "{{workspace_slug}}"
name: "{{program_name}}"
country_focus: "{{country_focus}}"
status: "{{status}}"
tagline: "{{program_tagline}}"
program_url: "{{program_url}}"

# Library-backed asset manifest. Each @alias maps to a library:video/...
# ref that resolves server-side via the workspace media library.
manifest:
  field-walking-towards-house: library:video/field-broll/field-walking-towards-house.mp4
  field-group-around-woman: library:video/field-broll/field-group-around-woman.mp4
  mobile-learn: library:video/mobile-screencast/mobile-learn.mp4
  mobile-mapping: library:video/mobile-screencast/mobile-mapping.mp4
  web-microplan: library:video/web-screencast/web-microplan.mp4
  mobile-pay: library:video/mobile-screencast/mobile-pay.mp4

scene:
  clips:
    - "@field-walking-towards-house"
    - "@field-group-around-woman"
  lower_third: "{{scene_lower_third}}"

# NO problem block — explainer mode omits the problem stat-card beat.

product:
  beats:
    - asset: "@mobile-learn"
      caption: "Learn — with an AI coach"
      is_demo_clip: true
    - asset: "@mobile-mapping"
      caption: "Verify — GPS at the point of care"
      is_demo_clip: true
    - asset: "@web-microplan"
      caption: "Verify — AI-assisted review"
      is_demo_clip: true
    - asset: "@mobile-pay"
      caption: "Pay — automatic, on verified work"
      is_demo_clip: true

# NO impact block — explainer mode omits the impact stat-card beat.

narration:
  generator: manual
  prompt_version: v1-connect-explainer
  start_seconds: 0
  by_beat:
    hook: "{{narration_hook}}"
    cycle: "{{narration_cycle}}"
    handoff: "{{narration_handoff}}"
    scene: "{{narration_scene}}"
    product: "{{narration_product}}"
    cta: ""
  script: ""

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
