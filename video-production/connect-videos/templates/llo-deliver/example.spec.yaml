# llo-deliver — fully-filled demo spec (~67s).
#
# Ready to POST to /videos/programs to render after the server-side
# staging step rewrites the library: refs. This is the LLO-facing cut:
# the audience is a local delivery organization deciding whether to
# deliver on Connect. Carries real Connect platform stats (an LLO needs
# proof it's real and paying) — grounded in cited facts, never invented.
#
# Beats (~67s): hook, cycle, handoff, deal (ai_build card), scene,
# problem (hero traction stat), product (train/deliver/audit/pay),
# impact (3 traction cards), cta. active_cut: ai keeps the deal card;
# flip to "standard" to drop it.
#
# NOTE: this template repurposes the ai_build beat as "the deal" card
# (headline + chips + subhead is content-generic). A dedicated DealCard
# component is a possible follow-up; for now the deal renders through the
# existing AiBuildCard with zero renderer changes.

provenance:
  generator: llo-deliver
  template: llo-deliver
  generated_from: https://connect.dimagi.com/
  generated_at: "2026-06-12T00:00:00Z"

slug: llo-deliver
workspace: dimagi-team
name: Connect
country_focus: Global
status: Live
tagline: "Deliver high-impact work in your community — paid for every verified visit."
program_url: https://connect.dimagi.com/

# Include the "deal" card (rendered via the ai_build beat). Set to
# "standard" to drop it.
active_cut: ai

# Stable workspace media-library refs. The render-prep staging step
# (apps/videos service._stage_spec) rewrites each library:<path> to
# gdrive:<id>.<ext> server-side before the renderer runs, so this example
# stays workspace-portable.
manifest:
  field-walking-towards-house: library:video/field-broll/field-walking-towards-house.mp4
  field-group-around-woman: library:video/field-broll/field-group-around-woman.mp4
  mobile-learn: library:video/mobile-screencast/mobile-learn.mp4
  mobile-mapping: library:video/mobile-screencast/mobile-mapping.mp4
  web-superset-graphs: library:video/web-screencast/web-superset-graphs.mp4
  mobile-pay: library:video/mobile-screencast/mobile-pay.mp4

# "The deal" card (rendered via the ai_build beat). The chips are the
# terms of the marketplace offer to a local delivery org.
ai_build:
  headline: "Get paid for every verified service"
  components:
    - "Performance-based contracts"
    - "Funding + technology, provided"
    - "Paid on verification"
    - "Scale against demand"
  subhead: "You bring the relationships; Connect brings funding and technology."

scene:
  clips:
    - "@field-walking-towards-house"
    - "@field-group-around-woman"
  lower_third: "Your teams, in the field"

# Hero traction stat — proof the platform is real and already paying.
problem:
  big: "1.5M+"
  caption: "verified services · 13 countries · 100+ organizations"
  source: "connect.dimagi.com"

product:
  beats:
    - asset: "@mobile-learn"
      caption: "Learn — with an AI coach"
      is_demo_clip: true
    - asset: "@mobile-mapping"
      caption: "Deliver — in their own communities"
      is_demo_clip: true
    - asset: "@web-superset-graphs"
      caption: "97.5% of real workers scored cleaner than paid fakers"
      is_demo_clip: true
    - asset: "@mobile-pay"
      caption: "Pay — for every verified service"
      is_demo_clip: true

# Traction stat cards — what an LLO most wants to know: what you're paid
# per service, and the scale of payments already flowing to the network.
impact:
  - big: "$1.70"
    caption: "paid per verified visit"
  - big: "$2M+"
    caption: "paid to frontline workers"

narration:
  generator: manual
  prompt_version: v1-llo-deliver
  start_seconds: 0
  by_beat:
    hook: "Connect is a two-sided marketplace for verified service delivery. You deliver; you're paid for every verified service."
    cycle: "One connected loop — Learn, Deliver, Verify, Pay. You're paid for work delivered, not work promised."
    handoff: "Here's what delivering on Connect looks like."
    ai_build: "You bring the relationships and delivery capacity; Connect brings funding and technology. Performance-based contracts, scaled against real demand."
    scene: "Your workers deliver in their own communities — every service verified the moment it happens."
    problem: "Not a pilot: one and a half million verified services across thirteen countries, with a hundred-plus frontline organizations already delivering."
    product: "Workers train with an AI coach and deliver guided visits — every service verified the moment it happens: biometric, GPS, photo. No manual reviews, no delays, no fraud."
    impact: "Pay only for verified delivery — no intervention pays as much, with over two million dollars paid to frontline workers."
    cta: ""
  script: |
    Connect is a two-sided marketplace for verified service delivery. You deliver; you're paid for every verified service.
    One connected loop — Learn, Deliver, Verify, Pay. You're paid for work delivered, not work promised.
    Here's what delivering on Connect looks like.
    You bring the relationships and delivery capacity; Connect brings funding and technology. Performance-based contracts, scaled against real demand.
    Your workers deliver in their own communities — every service verified the moment it happens.
    Not a pilot: one and a half million verified services across thirteen countries, with a hundred-plus frontline organizations already delivering.
    Workers train with an AI coach and deliver guided visits — every service verified the moment it happens: biometric, GPS, photo. No manual reviews, no delays, no fraud.
    Pay only for verified delivery — no intervention pays as much, with over two million dollars paid to frontline workers.

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
