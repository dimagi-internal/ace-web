# llo-deliver — fully-filled demo spec (~67s).
#
# Ready to POST to /videos/programs to render after the server-side
# staging step rewrites the library: refs. This is the LLO-facing cut:
# the audience is a local delivery organization deciding whether to
# deliver on Connect. Carries real Connect platform stats (an LLO needs
# proof it's real and paying) — grounded in cited facts, never invented.
#
# Beats (~67s): hook, cycle, handoff, deal (ai_build card), scene,
# problem (hero traction stat), product (train/deliver/audit/pay),
# impact (3 traction cards), cta. active_cut: ai keeps the deal card;
# flip to "standard" to drop it.
#
# NOTE: this template repurposes the ai_build beat as "the deal" card
# (headline + chips + subhead is content-generic). A dedicated DealCard
# component is a possible follow-up; for now the deal renders through the
# existing AiBuildCard with zero renderer changes.

provenance:
  generator: llo-deliver
  template: llo-deliver
  generated_from: https://connect.dimagi.com/
  generated_at: "2026-06-12T00:00:00Z"

slug: llo-deliver
workspace: dimagi-team
name: CommCare Connect
country_focus: Global
status: Live
tagline: "Deliver high-impact work in your community — paid for every verified visit."
program_url: https://connect.dimagi.com/

# Include the "deal" card (rendered via the ai_build beat). Set to
# "standard" to drop it.
active_cut: ai

# Stable workspace media-library refs. The render-prep staging step
# (apps/videos service._stage_spec) rewrites each library:<path> to
# gdrive:<id>.<ext> server-side before the renderer runs, so this example
# stays workspace-portable.
manifest:
  field-walking-towards-house: library:video/field-broll/field-walking-towards-house.mp4
  field-group-around-woman: library:video/field-broll/field-group-around-woman.mp4
  mobile-learn: library:video/mobile-screencast/mobile-learn.mp4
  mobile-mapping: library:video/mobile-screencast/mobile-mapping.mp4
  web-superset-graphs: library:video/web-screencast/web-superset-graphs.mp4
  mobile-pay: library:video/mobile-screencast/mobile-pay.mp4

# "The deal" card (rendered via the ai_build beat). The chips are the
# terms of the marketplace offer to a local delivery org.
ai_build:
  headline: "Get paid for every verified service"
  components:
    - "Pay-per-service contract"
    - "No infrastructure to build"
    - "Paid on verification"
    - "Start with a trial run"
  subhead: "Connect handles matching, verification, and payment — you focus on delivery."

scene:
  clips:
    - "@field-walking-towards-house"
    - "@field-group-around-woman"
  lower_third: "Your teams, in the field"

# Hero traction stat — proof the platform is real and already paying.
problem:
  big: "1.5M"
  caption: "verified services · 13 countries · 10× a year"
  source: "CommCare Connect, 2026"

product:
  beats:
    - asset: "@mobile-learn"
      caption: "Learn — train your workers with an AI coach"
      is_demo_clip: true
    - asset: "@mobile-mapping"
      caption: "Deliver — guided visits, GPS-verified"
      is_demo_clip: true
    - asset: "@web-superset-graphs"
      caption: "We paid workers to fake data — caught them all"
      is_demo_clip: true
    - asset: "@mobile-pay"
      caption: "Pay — per verified visit, on time"
      is_demo_clip: true

# Traction stat cards — Connect's tools make your teams beat seasoned
# implementers (more reach = more verified visits = more pay), and what
# you actually earn per visit.
impact:
  - big: "94%"
    caption: "reached — vs 84% without Connect"
  - big: "$1.30"
    caption: "average paid per verified visit"
    source: "CHC Nigeria pilot"

narration:
  generator: manual
  prompt_version: v1-llo-deliver
  start_seconds: 0
  by_beat:
    hook: "Connect is a marketplace for frontline delivery — think Airbnb. You deliver; you're paid for every verified visit."
    cycle: "Your teams run one loop — Learn, Deliver, Verify, Pay. Oversight is remote, never over your shoulder."
    handoff: "Here's what delivering on Connect looks like."
    ai_build: "Dimagi contracts you pay-per-service. You recruit and train; Connect matches, verifies, and pays — disputes settled by data, not arguments."
    scene: "Your workers go where people are — every visit GPS-stamped, photographed, and verified the moment it happens."
    problem: "Not a pilot: one and a half million verified services across thirteen countries, growing tenfold a year — with five Health Ministries signed on."
    product: "They train with an AI coach and deliver guided visits, each one verified. We paid workers to fake data — and caught them all. Honest work is protected; you're paid on the proof."
    impact: "Connect's microplanning reached ninety-four percent of people — versus eighty-four without it. More reach, more verified visits, more pay."
    cta: ""
  script: |
    Connect is a marketplace for frontline delivery — think Airbnb. You deliver; you're paid for every verified visit.
    Your teams run one loop — Learn, Deliver, Verify, Pay. Oversight is remote, never over your shoulder.
    Here's what delivering on Connect looks like.
    Dimagi contracts you pay-per-service. You recruit and train; Connect matches, verifies, and pays — disputes settled by data, not arguments.
    Your workers go where people are — every visit GPS-stamped, photographed, and verified the moment it happens.
    Not a pilot: one and a half million verified services across thirteen countries, growing tenfold a year — with five Health Ministries signed on.
    They train with an AI coach and deliver guided visits, each one verified. We paid workers to fake data — and caught them all. Honest work is protected; you're paid on the proof.
    Connect's microplanning reached ninety-four percent of people — versus eighty-four without it. More reach, more verified visits, more pay.

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
