# llo-deliver — spec skeleton.
#
# Author-time docs only; the template loader (apps/videos/templates.py)
# strips this leading comment block before returning skeleton_yaml so
# placeholder *references* inside doc text don't get substituted into the
# generated spec.
#
# This is the LLO-FACING "deliver on Connect" explainer — the other side
# of the marketplace from program-designer. It carries the full beat set
# including the problem (a light scale-context stat) and impact (mechanism
# cards) beats, plus the ai_build beat as a "how the work is split" card.
#
# TONE: this is an EXPLAINER, not a pitch. The audience already knows and
# likes Connect (they've had a real intro call). Walk them calmly through
# HOW it works — the loop, the split of work, how verification and payment
# happen. Avoid persuasion ("no intervention pays as much"), proof-point
# stat barrages, and marketplace pitch language. One light scale fact for
# context is fine; lead with mechanism, not selling.
#
# CUTS:
#   active_cut: ai        → includes the deal card (body_ai_build). ~67s.
#   active_cut: standard  → drops the deal card. ~60s.
#
# Placeholders the generator must fill:
#
#   Identity:
#     {{program_slug}}     slug — lowercase + hyphens (e.g. "llo-deliver")
#     {{workspace_slug}}   which ace-web workspace owns this video
#     {{program_name}}     generic display name (e.g. "Connect")
#     {{country_focus}}    primary region label (e.g. "Global")
#     {{status}}           short status line (e.g. "Live")
#     {{program_tagline}}  one-line tagline (LLO POV — paid for verified work)
#     {{program_url}}      canonical URL (e.g. https://connect.dimagi.com/)
#     {{template_id}}      echoed back — fill with the template id you fetched
#     {{generated_at}}     ISO-8601 UTC timestamp at fill time
#
#   "How the work is split" card (ai_build beat):
#     {{deal_headline}}        short, plain — e.g. "How the work is split".
#     {{deal_term_1..4}}       who does what, as chips (≤ ~5 words each):
#                              "You: workers + relationships", "Connect: the app
#                              & training", "Connect: verification", "Connect:
#                              payments".
#     {{deal_subhead}}         one line (e.g. "You focus on delivery; Connect
#                              runs the rest").
#
#   Scale-context stat (problem beat) — one calm fact, not a hard sell:
#     {{traction_big}}     a real connect.dimagi.com figure (e.g. "1.5M+")
#     {{traction_caption}} what it counts (e.g. "verified services, across 13 countries")
#     {{traction_source}}  citation (e.g. "connect.dimagi.com")
#
#   Mechanism cards (impact beat — TWO cards, how it works, not a sell):
#     {{impact_big_1}} / {{impact_caption_1}}              verification (e.g. "Verified" / "biometric, GPS, photo — as it happens")
#     {{impact_big_2}} / {{impact_caption_2}}              payment (e.g. "Paid on proof" / "straight to the worker's phone")
#
#   Per-section content:
#     {{scene_lower_third}}  e.g. "Your teams, in the field"
#
#   Per-beat narration (calm explainer; each ±2 words from target):
#     {{narration_hook}}     ~12w. Here's what it looks like to deliver a program on Connect.
#     {{narration_cycle}}    ~12w. Your teams run one loop: Learn, Deliver, Verify, and Pay.
#     {{narration_handoff}}  ~8w.  "here's how it works, step by step."
#     {{narration_deal}}     ~20w. You bring the frontline workers and local relationships; Connect provides the app, the verification, and the payments.
#     {{narration_scene}}    ~16w. Workers deliver in their own communities, and each visit is recorded as it happens.
#     {{narration_traction}} ~16w. Connect already runs this way — over a million verified services, across thirteen countries.
#     {{narration_product}}  ~28w. Workers learn on their phones with an AI coach, deliver guided visits, and each service is verified — biometric, GPS, and photo, the moment it happens.
#     {{narration_impact}}   ~12w. Once a service is verified, the worker is paid — directly, to their phone.
#     {{narration_cta}}      Leave empty — outro plays under the brand CTA card.

provenance:
  generator: llo-deliver
  template: "{{template_id}}"
  generated_from: "{{program_url}}"
  generated_at: "{{generated_at}}"

slug: "{{program_slug}}"
workspace: "{{workspace_slug}}"
name: "{{program_name}}"
country_focus: "{{country_focus}}"
status: "{{status}}"
tagline: "{{program_tagline}}"
program_url: "{{program_url}}"

# Which cut to render. "ai" includes the deal card (body_ai_build beat);
# "standard" drops it. Same spec, one field.
active_cut: ai

# Library-backed asset manifest. Each @alias maps to a library:video/...
# ref that resolves server-side via the workspace media library.
manifest:
  field-walking-towards-house: library:video/field-broll/field-walking-towards-house.mp4
  field-group-around-woman: library:video/field-broll/field-group-around-woman.mp4
  mobile-learn: library:video/mobile-screencast/mobile-learn.mp4
  mobile-mapping: library:video/mobile-screencast/mobile-mapping.mp4
  web-superset-graphs: library:video/web-screencast/web-superset-graphs.mp4
  mobile-pay: library:video/mobile-screencast/mobile-pay.mp4

# "The deal" card (ai_build beat). Pure motion graphic — no clip. The
# chips are the terms of the offer to a local delivery org.
ai_build:
  headline: "{{deal_headline}}"
  components:
    - "{{deal_term_1}}"
    - "{{deal_term_2}}"
    - "{{deal_term_3}}"
    - "{{deal_term_4}}"
  subhead: "{{deal_subhead}}"

scene:
  clips:
    - "@field-walking-towards-house"
    - "@field-group-around-woman"
  lower_third: "{{scene_lower_third}}"

# Hero traction stat — proof the platform is real and paying.
problem:
  big: "{{traction_big}}"
  caption: "{{traction_caption}}"
  source: "{{traction_source}}"

product:
  beats:
    - asset: "@mobile-learn"
      caption: "Learn — train your workers with an AI coach"
      is_demo_clip: true
    - asset: "@mobile-mapping"
      caption: "Deliver — guided visits, GPS-verified"
      is_demo_clip: true
    - asset: "@web-superset-graphs"
      caption: "Audited — honest delivery, protected"
      is_demo_clip: true
    - asset: "@mobile-pay"
      caption: "Pay — per verified visit, on time"
      is_demo_clip: true

# Two mechanism cards explaining how verification + payment work (not a
# sell). Keep them plain — e.g. "Verified" / "biometric, GPS, photo — as it
# happens" and "Paid on proof" / "straight to the worker's phone".
impact:
  - big: "{{impact_big_1}}"
    caption: "{{impact_caption_1}}"
  - big: "{{impact_big_2}}"
    caption: "{{impact_caption_2}}"
    source: "{{impact_source_2}}"

narration:
  generator: manual
  prompt_version: v1-llo-deliver
  start_seconds: 0
  by_beat:
    hook: "{{narration_hook}}"
    cycle: "{{narration_cycle}}"
    handoff: "{{narration_handoff}}"
    ai_build: "{{narration_deal}}"
    scene: "{{narration_scene}}"
    problem: "{{narration_traction}}"
    product: "{{narration_product}}"
    impact: "{{narration_impact}}"
    cta: ""
  script: ""

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
