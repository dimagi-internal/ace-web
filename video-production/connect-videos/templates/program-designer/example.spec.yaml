# program-designer — fully-filled demo spec (AI cut).
#
# Ready to POST to /videos/programs to render immediately. No
# {{placeholder}} tokens. This is the AI-CENTRIC cut: active_cut is "ai"
# and an `ai_build` block is present, so the renderer includes the
# body_ai_build beat ("AI builds your program"). Flip active_cut to
# "standard" (one field) to render the non-AI cut from this same spec —
# the ai_build beat drops out and nothing else changes.
#
# No problem block (explainer mode drops the problem stat beat); the
# impact block is three "why scale through Connect" cards carrying real,
# cited connect.dimagi.com facts (rapid deployment + economics of scale).
#
# Beats (AI cut, ~57s): hook, cycle, handoff, ai_build, scene, product,
# impact (why), cta. Standard cut (~50s) is the same minus ai_build.

provenance:
  generator: program-designer
  template: program-designer
  generated_from: https://connect.dimagi.com/
  generated_at: "2026-06-07T00:00:00Z"

slug: program-designer
workspace: dimagi-team
name: Connect
country_focus: Global
status: Live
tagline: "Bring your program to the last mile — paid for what's verified, not what's planned."
program_url: https://connect.dimagi.com/

# AI cut: include the body_ai_build beat. Set to "standard" to drop it.
active_cut: ai

# Stable workspace media-library refs (`@alias` clip references resolve
# against these). The render-prep staging step rewrites each library:<path>
# to gdrive:<id>.<ext> server-side (apps/videos service._stage_spec) before
# the renderer runs, so this template example stays workspace-portable.
manifest:
  field-walking-towards-house: library:video/field-broll/field-walking-towards-house.mp4
  field-group-around-woman: library:video/field-broll/field-group-around-woman.mp4
  mobile-learn: library:video/mobile-screencast/mobile-learn.mp4
  mobile-mapping: library:video/mobile-screencast/mobile-mapping.mp4
  web-microplan: library:video/web-screencast/web-microplan.mp4
  mobile-pay: library:video/mobile-screencast/mobile-pay.mp4

# The "rapid deployment" card (AI cut only). Pure motion graphic — no
# clip. The chips are the infrastructure Connect provides so a program can
# deploy in as few as 10 days.
ai_build:
  headline: "Deployed in as few as 10 days"
  components:
    - "Training"
    - "Delivery app"
    - "Verification"
    - "Payments"
  subhead: "Connect provides the infrastructure; you bring the program."

scene:
  clips:
    - "@field-walking-towards-house"
    - "@field-group-around-woman"
  lower_third: "Your program, in the field"

product:
  beats:
    - asset: "@mobile-learn"
      caption: "Learn — with an AI coach"
      is_demo_clip: true
    - asset: "@mobile-mapping"
      caption: "Deliver — in their own communities"
      is_demo_clip: true
    - asset: "@web-microplan"
      caption: "Verify — the moment it happens"
      is_demo_clip: true
    - asset: "@mobile-pay"
      caption: "Pay — for every verified service"
      is_demo_clip: true

# The "why scale through Connect" beat — three cards of REAL, cited
# platform facts drawn from connect.dimagi.com: the speed of deployment,
# the economics of scale, and the proof of scale already reached.
impact:
  - big: "10 days"
    caption: "to first deployment"
  - big: "22%"
    caption: "cost reduction per visit as you scale"
  - big: "1.5M+"
    caption: "verified services across 13 countries"

narration:
  generator: manual
  prompt_version: v1-program-designer
  start_seconds: 0
  by_beat:
    hook: "For decades, programs paid for planned activity and hoped it added up. Connect pays for verified delivery."
    cycle: "Pick the program, geography, and amount — then it runs as one loop: Learn, Deliver, Verify, Pay."
    handoff: "Here's how your program comes onto Connect."
    ai_build: "Connect provides the app, training, verification, and payments — your program deployed in as few as ten days, then scaled against demand."
    scene: "Frontline workers deliver in their own communities — and you see exactly what was delivered, where, and at what cost."
    product: "Workers train with an AI coach, deliver guided visits, and every service is verified — biometric, GPS, photo. Then payment follows the proof."
    impact: "Deployed in as few as ten days, then scaled against demand — with costs falling twenty-two percent per visit as programs grow."
    cta: ""
  script: |
    For decades, programs paid for planned activity and hoped it added up. Connect pays for verified delivery.
    Pick the program, geography, and amount — then it runs as one loop: Learn, Deliver, Verify, Pay.
    Here's how your program comes onto Connect.
    Connect provides the app, training, verification, and payments — your program deployed in as few as ten days, then scaled against demand.
    Frontline workers deliver in their own communities — and you see exactly what was delivered, where, and at what cost.
    Workers train with an AI coach, deliver guided visits, and every service is verified — biometric, GPS, photo. Then payment follows the proof.
    Deployed in as few as ten days, then scaled against demand — with costs falling twenty-two percent per visit as programs grow.

voice:
  provider: elevenlabs
  voice_id: "XB0fDUnXU5powFXDhCwa"
  model: eleven_turbo_v2
